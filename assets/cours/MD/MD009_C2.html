<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Limites – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =

            [
                {
                    "title": "Étape 1 : Résolution d'une équation différentielle avec second membre par changement de fonction",
                    "content": "On considère dans $\\mathbb{R}$ l’équation différentielle $(E) : y' + 2y = e^{-2x}$.\n\n1. Vérifie que la fonction $g$ telle que $g(x) = (x + 1)e^{-2x}$ est une solution de $(E)$.\n2. Démontre qu’une fonction $h + g$ est solution de $(E)$ si et seulement si la fonction $h$ est solution de l’équation différentielle $(E') : y' + 2y = 0$.\n3. Détermine les solutions sur $\\mathbb{R}$ de l’équation différentielle $(E')$.\n4. a) Déduis des questions précédentes, les solutions sur $\\mathbb{R}$ de l’équation différentielle $(E)$.\n   b) Détermine la solution $f$ de $(E)$ vérifiant la condition $f(0) = -2$.",
                    "example": "**Résolution complète de l'exercice :**\n\n**1. Vérification pour g :**\n$g(x) = (x + 1)e^{-2x}$.\nCalculons la dérivée : $g'(x) = 1 \\cdot e^{-2x} + (x+1) \\cdot (-2e^{-2x}) = e^{-2x} - 2xe^{-2x} - 2e^{-2x} = (-2x - 1)e^{-2x}$.\nInjectons dans $(E)$ :\n$g'(x) + 2g(x) = (-2x - 1)e^{-2x} + 2(x+1)e^{-2x}$\n$= (-2x - 1 + 2x + 2)e^{-2x} = e^{-2x}$.\nDonc $g$ est bien solution de $(E)$.\n\n**2. Démonstration :**\n$(h+g)$ est solution de $(E) \\iff (h+g)' + 2(h+g) = e^{-2x}$\n$\\iff h' + g' + 2h + 2g = e^{-2x}$\n$\\iff h' + 2h + (g' + 2g) = e^{-2x}$\nOr, on sait que $g' + 2g = e^{-2x}$, donc :\n$\\iff h' + 2h + e^{-2x} = e^{-2x} \\iff h' + 2h = 0$.\nPar suite, $h$ est solution de $(E') : y' + 2y = 0$.\n\n**3. Solutions de (E') :**\nL'équation est de la forme $y' + ay = 0$ avec $a = 2$.\nLes solutions sont les fonctions $h$ définies sur $\\mathbb{R}$ par :\n$h(x) = ke^{-2x}, k \\in \\mathbb{R}$.\n\n**4. a) Solutions de (E) :**\nD'après ce qui précède, $f$ est solution de $(E) \\iff f - g$ est solution de $(E')$.\nDonc $f(x) - g(x) = h(x) \\implies f(x) = h(x) + g(x)$.\n$f(x) = ke^{-2x} + (x+1)e^{-2x} = (k + x + 1)e^{-2x}, k \\in \\mathbb{R}$.\n\n**4. b) Condition initiale :**\n$f(0) = -2 \\iff (k + 0 + 1)e^0 = -2$\n$\\iff k + 1 = -2 \\iff k = -3$.\nLa solution unique est $f(x) = (x - 2)e^{-2x}$.",
                    "extras": [
                        "Exemple complet : Résoudre $y' + y = x$. \nOn trouve une solution particulière $g(x) = x - 1$. \nL'équation homogène est $y' + y = 0$ de solution $h(x) = ke^{-x}$. \nLa solution générale est $f(x) = ke^{-x} + x - 1$.",
                        "Exemple complet : Soit $y' - 3y = e^{2x}$. \nOn vérifie que $g(x) = -e^{2x}$ est solution. \n$(g') - 3g = -2e^{2x} - 3(-e^{2x}) = e^{2x}$. \nLes solutions de $y' - 3y = 0$ sont $ke^{3x}$. \nSolutions de $(E) : f(x) = ke^{3x} - e^{2x}$.",
                        "Remarque : Cette méthode s'appelle la superposition des solutions (solution générale de l'équation homogène + solution particulière)."
                    ]
                },
                {
                    "title": "Étape 2 : Exercice d'approfondissement sur la recherche de solution particulière",
                    "content": "On considère l’équation différentielle $(E) : y' + 3y = 2e^{-x}$.\n\n1. Détermine le nombre réel $m$ pour que la fonction $h$ définie sur $\\mathbb{R}$ par $h(x) = me^{-x}$ soit solution de $(E)$.\n2. Résous dans $\\mathbb{R}$ l’équation différentielle $(E') : y' + 3y = 0$.\n3. Démontre qu’une fonction $g$ est solution de $(E)$ si et seulement si la fonction $g - h$ est solution de $(E')$.\n4. Déduis des questions précédentes les solutions sur $\\mathbb{R}$ de l’équation différentielle $(E)$.",
                    "example": "**Résolution complète de l'exercice :**\n\n**1. Détermination de m :**\n$h(x) = me^{-x} \\implies h'(x) = -me^{-x}$.\n$h$ est solution de $(E) \\iff h'(x) + 3h(x) = 2e^{-x}$\n$\\iff -me^{-x} + 3(me^{-x}) = 2e^{-x}$\n$\\iff 2me^{-x} = 2e^{-x} \\iff 2m = 2 \\iff m = 1$.\nLa solution particulière est donc $h(x) = e^{-x}$.\n\n**2. Résolution de (E') :**\n$y' + 3y = 0$ est une équation du type $y' + ay = 0$ avec $a = 3$.\nLes solutions sont les fonctions $u$ définies par :\n$u(x) = ke^{-3x}, k \\in \\mathbb{R}$.\n\n**3. Démonstration de l'équivalence :**\n$g$ est solution de $(E) \\iff g' + 3g = 2e^{-x}$\nComme $h' + 3h = 2e^{-x}$, on peut écrire :\n$\\iff g' + 3g = h' + 3h$\n$\\iff g' - h' + 3g - 3h = 0$\n$\\iff (g - h)' + 3(g - h) = 0$\nCela signifie exactement que la fonction $(g - h)$ est solution de $(E')$.\n\n**4. Solutions générales de (E) :**\nOn a $(g - h)(x) = ke^{-3x}$.\n$g(x) = ke^{-3x} + h(x)$\n$g(x) = ke^{-3x} + e^{-x}, k \\in \\mathbb{R}$.",
                    "extras": [
                        "Exemple complet : Trouver $m$ pour que $h(x) = mx + p$ soit solution de $y' + y = x$. \n$h'(x) = m$. On a $m + (mx + p) = x$. \nPar identification : $m = 1$ et $m + p = 0 \\implies p = -1$. \nSolution particulière : $h(x) = x - 1$.",
                        "Exemple complet : Résoudre $y' + 2y = 4$. \nRecherchons une solution constante $y = C$. \n$0 + 2C = 4 \\implies C = 2$. \nSolutions homogènes : $ke^{-2x}$. \nSolution générale : $f(x) = ke^{-2x} + 2$.",
                        "Exemple complet : Pour $y' - y = 2e^x$. On cherche $h(x) = mxe^x$ (car $e^x$ est déjà solution de l'équation homogène). \n$h'(x) = me^x + mxe^x$. \n$h' - h = me^x + mxe^x - mxe^x = me^x$. \n$me^x = 2e^x \\implies m = 2$. \n$f(x) = ke^x + 2xe^x = (k + 2x)e^x$.",
                        "Exemple complet : Résoudre $y' + 3y = e^x$. \nCherchons $h(x) = me^x$. \n$me^x + 3me^x = e^x \\implies 4m = 1 \\implies m = 0,25$. \n$f(x) = ke^{-3x} + 0,25e^x$.",
                        "Exemple complet : $y' + 2y = \u03c3$. Si $\u03c3=10$. \nSolution particulière : $y = 5$. \nSolution générale : $ke^{-2x} + 5$.",
                        "Exemple complet : $y' - 5y = 0$ avec $f(0)=7$. \n$f(x) = ke^{5x}$. $f(0)=k=7$. \nSolution : $f(x) = 7e^{5x}$.",
                        "Exemple complet : $y' + y = 2e^{-x}$. \nCherchons $h(x) = mxe^{-x}$. \n$h' = me^{-x} - mxe^{-x}$. \n$h' + h = me^{-x} = 2e^{-x} \\implies m = 2$. \n$f(x) = (k + 2x)e^{-x}$.",
                        "Exemple complet : $y' + 4y = 8e^{x}$. \n$me^x + 4me^x = 8e^x \\implies 5m = 8 \\implies m = 1,6$. \n$f(x) = ke^{-4x} + 1,6e^x$.",
                        "Exemple complet : $y' = 2y + 1$. \n$y' - 2y = 1$. \nSolution homogène : $ke^{2x}$. \nSolution particulière : $-0,5$. \n$f(x) = ke^{2x} - 0,5$.",
                        "Exemple complet : $y' + 3y = \u03c3$. Avec $f(0)=1$ et $\u03c3=3$. \nSolution particulière : $1$. \n$f(x) = ke^{-3x} + 1$. \n$f(0) = k + 1 = 1 \\implies k = 0$. \nSolution : $f(x) = 1$."
                    ]
                }
            ]




            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
