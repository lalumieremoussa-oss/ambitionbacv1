<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Limites – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =


            [
                {
                    "title": "Étape 1 : Modélisation et résolution d'un problème démographique (Équation Différentielle)",
                    "content": "Dans de nombreux modèles de croissance démographique, on considère que la vitesse d'accroissement de la population est proportionnelle au nombre d'habitants à un instant donné. Cela conduit à une équation différentielle du type $y' = ay$. \n\n**SITUATION COMPLEXE :**\nLors d’une campagne intitulée « 7 Milliards d’Actions », des élèves apprennent que la population d’un pays était de 4,75 millions d’habitants en 1990 et de 5,5 millions d’habitants en 1995. On suppose que l'évolution de cette population $N(t)$ (en millions) suit l'équation différentielle $N'(t) = a N(t)$, où $t$ représente le nombre d'années écoulées depuis 1990.\n\nLes élèves veulent déterminer l’année exacte où la population de ce pays atteindra 20 millions d’habitants.",
                    "example": "**Résolution complète de la situation :**\n\n**1. Choix du modèle et résolution de l'équation :**\nL'équation $N'(t) = a N(t)$ (ou $N' - aN = 0$) a pour solution générale :\n$N(t) = k e^{at}$\n\n**2. Détermination de la constante $k$ :**\nEn 1990 ($t=0$), la population est de 4,75 millions.\n$N(0) = k e^{a(0)} = 4,75$\n$k \\times 1 = 4,75 \\implies k = 4,75$\nDonc $N(t) = 4,75 e^{at}$\n\n**3. Détermination du taux de croissance $a$ :**\nEn 1995 ($t=5$), la population est de 5,5 millions.\n$N(5) = 4,75 e^{5a} = 5,5$\n$e^{5a} = \\frac{5,5}{4,75} \\approx 1,1579$\n$5a = \\ln(1,1579) \\approx 0,1466$\n$a = \\frac{0,1466}{5} \\approx 0,0293$\n\n**4. Recherche de l'année pour $N(t) = 20$ :**\n$4,75 e^{0,0293t} = 20$\n$e^{0,0293t} = \\frac{20}{4,75} \\approx 4,2105$\n$0,0293t = \\ln(4,2105) \\approx 1,4375$\n$t = \\frac{1,4375}{0,0293} \\approx 49,06$\n\n**Conclusion :**\nLa population atteindra 20 millions environ 49 ans après 1990, soit en **2039**.",
                    "extras": [
                        "Exemple complet : Un capital de 1000 € est placé à un taux d'intérêt continu. Le montant $M(t)$ suit $M'(t) = 0,05 M(t)$.\nAprès résolution : $M(t) = 1000 e^{0,05t}$.\nPour que le capital double (2000 €) :\n$2000 = 1000 e^{0,05t} \\implies 2 = e^{0,05t} \\implies \\ln(2) = 0,05t$.\n$t = \\frac{\\ln(2)}{0,05} \\approx 13,86$ années.",
                        "Exemple complet : La population d'une colonie de bactéries triple toutes les 2 heures. On a $N(t) = N_0 e^{at}$.\nSi $N(2) = 3 N_0$, alors $e^{2a} = 3 \\implies 2a = \\ln(3) \\implies a = \\frac{\\ln(3)}{2} \\approx 0,549$.\nL'équation est $N(t) = N_0 e^{0,549t}$.",
                        "Exemple complet : Décroissance radioactive. La quantité de matière $Q(t)$ suit $Q'(t) = -0,01 Q(t)$.\nSi $Q(0) = 500$g, alors $Q(t) = 500 e^{-0,01t}$.\nAu bout de 100 jours, il reste $Q(100) = 500 e^{-1} \\approx 183,94$g."
                    ]
                }
            ]



            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
