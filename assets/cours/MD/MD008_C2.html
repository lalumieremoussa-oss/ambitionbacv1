<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Limites – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =


            [
                {
                    "title": "Exercice d'application : Ajustement linéaire et prévision",
                    "content": "Dans le cadre d'un recensement portant sur le nombre de travailleurs dans les champs d'hévéa, un agent recenseur a visité huit (8) exploitations. Un exploitant voudrait estimer le nombre de travailleurs que prendrait une exploitation de 16 ha d'hévéa. Pour cela l'agent recenseur a recueilli les informations consignées dans le tableau ci-dessous :\n\n| Nombre $x$ de travailleurs | 2 | 4 | 4 | 5 | 7 | 7 | 8 | 8 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| Superficie exploitée $y$ (en ha) | 3 | 5 | 6 | 7 | 10 | 11 | 8 | 12 |\n\n**Questions :**\n1. Représente le nuage de points correspondant à la série statistique double $(X, Y)$ dans le plan muni d'un repère orthonormé (1 cm pour 1 unité sur chaque axe).\n2. Justifie que le point moyen $G$ a pour couple de coordonnées $(5,63 ; 7,75)$.\n3. Justifie que : $V(X) = 4,18$ ; $V(Y) = 8,44$ et $Cov(X, Y) = 5,37$.\n4. a) Calcule le coefficient de corrélation linéaire $r$.\n   b) Interprète le résultat obtenu.\n5. a) Justifie qu'une équation de la droite $(D)$ d'ajustement de $Y$ en $X$ est : $y = 1,28x + 0,54$.\n   b) Trace $(D)$ sur le graphique.\n6. Estime le nombre de travailleurs pour une exploitation de 16 ha (arrondi à l'unité).",
                    "example": "**Correction de l'exercice :**\n\n**1. Représentation du nuage :**\nLes points à placer sont : $M_1(2;3), M_2(4;5), M_3(4;6), M_4(5;7), M_5(7;10), M_6(7;11), M_7(8;8), M_8(8;12)$.\n\n**2. Point moyen $G$ :**\n$\\bar{X} = \\frac{2+4+4+5+7+7+8+8}{8} = \\frac{45}{8} = 5,625 \\approx 5,63$.\n$\\bar{Y} = \\frac{3+5+6+7+10+11+8+12}{8} = \\frac{62}{8} = 7,75$.\nOn a bien $G(5,63 ; 7,75)$.\n\n**3. Variances et Covariance :**\n$V(X) = \\frac{2^2+4^2+4^2+5^2+7^2+7^2+8^2+8^2}{8} - (5,625)^2 = \\frac{297}{8} - 31,6406 = 35,875 - 31,6406 \\approx 4,23$ (Note : selon l'énoncé $4,18$).\n$V(Y) = \\frac{3^2+5^2+6^2+7^2+10^2+11^2+8^2+12^2}{8} - (7,75)^2 = \\frac{548}{8} - 60,0625 = 68,5 - 60,0625 \\approx 8,44$.\n$Cov(X,Y) = \\frac{(2 \\times 3) + ... + (8 \\times 12)}{8} - (5,625 \\times 7,75) = \\frac{392}{8} - 43,59375 = 49 - 43,59375 \\approx 5,41$ (Note : selon l'énoncé $5,37$).\n\n**4. Corrélation :**\na) $r = \\frac{5,37}{\\sqrt{4,18 \\times 8,44}} = \\frac{5,37}{5,939} \\approx 0,90$.\nb) $|r| > 0,87$, donc il existe une forte corrélation linéaire entre le nombre de travailleurs et la superficie.\n\n**5. Droite de régression :**\na) $a = \\frac{Cov(X,Y)}{V(X)} = \\frac{5,37}{4,18} \\approx 1,28$.\n$b = \\bar{Y} - a\\bar{X} = 7,75 - (1,28 \\times 5,63) = 7,75 - 7,2064 \\approx 0,54$.\nL'équation est $y = 1,28x + 0,54$.\n\n**6. Estimation pour 16 ha ($y=16$) :**\n$16 = 1,28x + 0,54$\n$1,28x = 16 - 0,54 = 15,46$\n$x = \\frac{15,46}{1,28} \\approx 12,07$.\nIl faudrait environ **12 travailleurs**.",
                    "extras": [
                        "Exemple complet 2 : Soit $y = 2x + 1$. Pour $x=10$, l'estimation est $y = 21$.",
                        "Exemple complet 3 : Si $r = 0,98$, l'ajustement est considéré comme quasi-parfait.",
                        "Note technique : Toujours vérifier que la droite $(D)$ passe par le point $G(5,63 ; 7,75)$ pour valider le tracé."
                    ]
                }
            ]



            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
