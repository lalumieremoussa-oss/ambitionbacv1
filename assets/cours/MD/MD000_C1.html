<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Equations du second degré – par Formateur Coulibaly</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =

            [
                {
                    "title": "Étape 1 : Cas où le discriminant est strictement positif ($Δ > 0$)",
                    "content": "Pour une équation du second degré de la forme $ax^2 + bx + c = 0$ (avec $a \\neq 0$), \non calcule le discriminant $Δ = b^2 - 4ac$.\nLorsque $Δ > 0$, l'équation admet deux solutions réelles distinctes notées $x_1$ et $x_2$.\nLa formule des racines est :\n$x_1 = \\frac{-b - \\sqrt{Δ}}{2a}$\n$x_2 = \\frac{-b + \\sqrt{Δ}}{2a}$\nLe trinôme peut alors être factorisé sous la forme : $P(x) = a(x - x_1)(x - x_2)$.\nConcernant le signe, le trinôme est du signe de $a$ à l'extérieur des racines et du signe de $-a$ entre les racines.",
                    "example": "Résolvons l'équation $x^2 - 5x + 6 = 0$ :\nIci $a = 1$, $b = -5$ et $c = 6$.\nCalcul du discriminant :\n$Δ = (-5)^2 - 4 \\times 1 \\times 6$\n$Δ = 25 - 24 = 1$.\nComme $Δ > 0$, il y a deux solutions :\n$x_1 = \\frac{-(-5) - \\sqrt{1}}{2 \\times 1} = \\frac{5 - 1}{2} = \\frac{4}{2} = 2$\n$x_2 = \\frac{-(-5) + \\sqrt{1}}{2 \\times 1} = \\frac{5 + 1}{2} = \\frac{6}{2} = 3$\nL'ensemble de solution est $S = \\{2 ; 3\\}$.\nLa forme factorisée est : $(x - 2)(x - 3)$. ",
                    "extras": [
                        "Exemple complet : Résolvons $2x^2 - 3x + 1 = 0$.\n$a = 2, b = -3, c = 1$.\n$Δ = (-3)^2 - 4(2)(1) = 9 - 8 = 1$.\n$x_1 = \\frac{3 - 1}{4} = 0,5$ et $x_2 = \\frac{3 + 1}{4} = 1$.\n$S = \\{0,5 ; 1\\}$.",
                        "Exemple complet : Résolvons $x^2 + x - 2 = 0$.\n$a = 1, b = 1, c = -2$.\n$Δ = 1^2 - 4(1)(-2) = 1 + 8 = 9$.\n$x_1 = \\frac{-1 - 3}{2} = -2$ et $x_2 = \\frac{-1 + 3}{2} = 1$.\n$S = \\{-2 ; 1\\}$.",
                        "Exemple de factorisation : Pour $x^2 - 5x + 6$, le signe est positif (car $a=1 > 0$) sur $]-\\infty ; 2[ \\cup ]3 ; +\\infty[ et négatif sur $]2 ; 3[."
                    ]
                },
                {
                    "title": "Étape 2 : Cas où le discriminant est nul ($Δ = 0$)",
                    "content": "Lorsque le calcul du discriminant $Δ = b^2 - 4ac$ donne exactement $0$, l'équation $ax^2 + bx + c = 0$ possède une unique solution réelle, appelée racine double.\nCette solution est donnée par la formule :\n$x_0 = \\frac{-b}{2a}$\nDans ce cas précis, le trinôme est une identité remarquable et sa forme factorisée est :\n$P(x) = a(x - x_0)^2$\nLe signe du trinôme est toujours celui de $a$ pour tout $x$ différent de $x_0$, et il s'annule en $x_0$.",
                    "example": "Résolvons l'équation $x^2 - 6x + 9 = 0$ :\nIci $a = 1$, $b = -6$ et $c = 9$.\nCalcul du discriminant :\n$Δ = (-6)^2 - 4 \\times 1 \\times 9$\n$Δ = 36 - 36 = 0$.\nComme $Δ = 0$, il y a une seule solution (racine double) :\n$x_0 = \\frac{-(-6)}{2 \\times 1} = \\frac{6}{2} = 3$\nL'ensemble de solution est $S = \\{3\\}$.\nLa forme factorisée est : $1(x - 3)^2 = (x - 3)^2$.",
                    "extras": [
                        "Exemple complet : Résolvons $4x^2 + 4x + 1 = 0$.\n$a = 4, b = 4, c = 1$.\n$Δ = 4^2 - 4(4)(1) = 16 - 16 = 0$.\n$x_0 = \\frac{-4}{2(4)} = \\frac{-4}{8} = -0,5$.\n$S = \\{-0,5\\}$.",
                        "Exemple complet : Résolvons $x^2 + 10x + 25 = 0$.\n$a = 1, b = 10, c = 25$.\n$Δ = 10^2 - 4(1)(25) = 100 - 100 = 0$.\n$x_0 = \\frac{-10}{2} = -5$.\n$S = \\{-5\\}$.",
                        "Remarque sur le signe : Pour $x^2 - 6x + 9$, comme $a=1$, le trinôme est toujours positif ou nul sur $\\mathbb{R}$."
                    ]
                },
                {
                    "title": "Étape 3 : Cas où le discriminant est strictement négatif ($Δ < 0$)",
                    "content": "Si le calcul du discriminant $Δ = b^2 - 4ac$ aboutit à un nombre strictement inférieur à zéro ($Δ < 0$), alors l'équation $ax^2 + bx + c = 0$ n'admet aucune solution réelle.\nL'ensemble des solutions est l'ensemble vide, noté $S = \\emptyset$ ou $S = \\{ \\}$.\nDans ce cas, le trinôme $ax^2 + bx + c$ n'est pas factorisable dans l'ensemble des réels ($\\mathbb{R}$).\nLe signe du trinôme ne change jamais : il est du signe de $a$ pour toutes les valeurs de $x$.",
                    "example": "Résolvons l'équation $x^2 + 2x + 5 = 0$ :\nIci $a = 1$, $b = 2$ et $c = 5$.\nCalcul du discriminant :\n$Δ = 2^2 - 4 \\times 1 \\times 5$\n$Δ = 4 - 20 = -16$.\nComme $Δ = -16 < 0$, l'équation n'a pas de solution réelle.\nL'ensemble de solution est $S = \\emptyset$.\nLe trinôme $x^2 + 2x + 5$ est toujours strictement positif car $a = 1 > 0$.",
                    "extras": [
                        "Exemple complet : Résolvons $x^2 + x + 1 = 0$.\n$a = 1, b = 1, c = 1$.\n$Δ = 1^2 - 4(1)(1) = 1 - 4 = -3$.\n$Δ < 0$, donc $S = \\emptyset$.",
                        "Exemple complet : Résolvons $2x^2 - 2x + 10 = 0$.\n$a = 2, b = -2, c = 10$.\n$Δ = (-2)^2 - 4(2)(10) = 4 - 80 = -76$.\n$Δ < 0$, donc aucune solution réelle.",
                        "Analyse du signe : Pour $-x^2 + x - 5$, le $Δ$ est négatif et $a = -1$, donc l'expression est toujours négative pour tout $x$ réel."
                    ]
                }
            ]




            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
