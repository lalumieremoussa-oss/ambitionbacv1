<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Epreuve de Bermouli – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =


            [
                {
                    "title": "Étape 1 : Épreuve de Bernoulli et Schéma de Bernoulli",
                    "content": "Une épreuve de Bernoulli est la forme la plus simple d'expérience aléatoire : elle ne comporte que deux issues possibles que l'on nomme par convention **Succès** (noté $S$) et **Échec** (noté $\\bar{S}$).\nLa probabilité du succès est notée $p$ et celle de l'échec est $q = 1 - p$.\n\nLorsqu'on répète cette même expérience $n$ fois de suite, de manière **identique** et **indépendante** (le résultat d'un lancer ne change pas les probabilités du suivant), on obtient ce qu'on appelle un **Schéma de Bernoulli** de paramètres $n$ et $p$.\nC'est la base de la loi binomiale, qui permet de compter le nombre de succès obtenus sur la totalité des essais.",
                    "example": "**Situation : Lancer d'un dé cubique**\nOn lance un dé équilibré à 6 faces. On s'intéresse uniquement au fait d'obtenir le chiffre 6.\n\n**Analyse complète :**\n1. Il s'agit d'une épreuve de Bernoulli car il n'y a que deux issues pour notre objectif :\n- Succès $S$ : « Obtenir le 6 », de probabilité $p = \\frac{1}{6}$.\n- Échec $\\bar{S}$ : « Ne pas obtenir le 6 », de probabilité $q = 1 - \\frac{1}{6} = \\frac{5}{6}$.\n\n2. Si on lance ce dé 6 fois de suite, on a un schéma de Bernoulli avec $n = 6$ et $p = \\frac{1}{6}$.\n\n**Calcul de la probabilité d'obtenir exactement 4 fois le chiffre 6 :**\nOn utilise la formule de la loi binomiale : $P(X = k) = C_n^k \\times p^k \\times q^{n-k}$.\nIci $n=6$, $k=4$, $p=1/6$ et $q=5/6$.\n\n$P(X = 4) = C_6^4 \\times (\\frac{1}{6})^4 \\times (\\frac{5}{6})^{6-4}$\n$P(X = 4) = 15 \\times \\frac{1}{1296} \\times \\frac{25}{36}$\n$P(X = 4) = \\frac{375}{46656} \\approx 0,008$.",
                    "extras": [
                        "Exemple complet : On lance une pièce de monnaie équilibrée 10 fois. Calculons la probabilité d'avoir exactement 5 fois 'Pile'.\nIci $n=10, p=0,5, q=0,5$.\n$P(X=5) = C_{10}^5 \\times (0,5)^5 \\times (0,5)^5$\n$P(X=5) = 252 \\times (0,5)^{10} = 252 \\times \\frac{1}{1024} \\approx 0,246$.",
                        "Exemple complet : Un tireur à l'arc a une probabilité $p=0,8$ de toucher la cible. Il tire 3 flèches.\nCalculons la probabilité qu'il rate les 3 tirs ($X=0$).\n$P(X=0) = C_3^0 \\times (0,8)^0 \\times (0,2)^3 = 1 \\times 1 \\times 0,008 = 0,008$.",
                        "Exemple complet : Dans une usine, 5% des pièces sont défectueuses. On prélève un échantillon de 4 pièces (tirage avec remise assimilé).\nProbabilité d'avoir exactement 1 pièce défectueuse ($n=4, p=0,05, k=1$):\n$P(X=1) = C_4^1 \\times (0,05)^1 \\times (0,95)^3 = 4 \\times 0,05 \\times 0,857375 = 0,171475$."
                    ]
                },
                {
                    "title": "Étape 2 : Événement contraire et Probabilité d'obtenir « au moins un »",
                    "content": "Dans un schéma de Bernoulli, calculer la probabilité d'obtenir « au moins un succès » peut être très long si on additionne toutes les probabilités ($P(X=1) + P(X=2) + \\dots$).\nLa méthode la plus rapide consiste à utiliser l'**événement contraire**.\nL'inverse de « obtenir au moins un succès » est « n'obtenir aucun succès » ($X=0$).\n\n**La formule simplifiée est :**\n$P(X \\ge 1) = 1 - P(X = 0)$\nComme $P(X=0) = q^n$, on obtient : \n$P(X \\ge 1) = 1 - (1 - p)^n$.\n\nCette formule est extrêmement utile pour déterminer combien de fois il faut répéter une expérience pour atteindre un certain seuil de confiance.",
                    "example": "**Situation : Combien de lancers pour gagner ?**\nOn lance le dé à 6 faces $n$ fois. On veut que la probabilité d'obtenir au moins une fois le chiffre 6 soit supérieure ou égale à 95% ($0,95$).\n\n**Résolution détaillée :**\nOn cherche $n$ tel que $P(X \\ge 1) \\ge 0,95$.\nEn utilisant l'événement contraire :\n$1 - (\\frac{5}{6})^n \\ge 0,95$\n$-(\\frac{5}{6})^n \\ge 0,95 - 1$\n$-(\\frac{5}{6})^n \\ge -0,05$\n$(\frac{5}{6})^n \\le 0,05$\n\nOn passe au logarithme (ln) :\n$n \\times \\ln(\\frac{5}{6}) \\le \\ln(0,05)$\nAttention : $\\ln(5/6)$ est négatif, donc on change le sens de l'inégalité en divisant :\n$n \\ge \\frac{\\ln(0,05)}{\\ln(5/6)}$\n$n \\ge \\frac{-2,9957}{-0,1823}$\n$n \\ge 16,43$.\n\n**Résultat :** Il faut lancer le dé au moins **17 fois** pour être sûr à 95% d'obtenir au moins un 6.",
                    "extras": [
                        "Exemple complet : On lance une pièce 5 fois. Quelle est la probabilité d'obtenir au moins une fois Face ?\n$P(X \\ge 1) = 1 - (1/2)^5 = 1 - 1/32 = 31/32 \\approx 0,968$.",
                        "Exemple complet : Un jeu a une probabilité de gain de $p=0,1$. On joue 3 fois.\nProbabilité d'obtenir au moins un gain :\n$P(X \\ge 1) = 1 - (0,9)^3 = 1 - 0,729 = 0,271$.",
                        "Exemple complet : Un système d'alarme a une probabilité de $0,99$ de fonctionner. On installe 2 alarmes indépendantes.\nProbabilité que le système global fonctionne (au moins une alarme) :\n$P = 1 - (0,01)^2 = 1 - 0,0001 = 0,9999$."
                    ]
                },
                {
                    "title": "Étape 3 : Variable Aléatoire Somme et Fonction de Répartition",
                    "content": "Lorsque l'expérience consiste à faire la somme de deux résultats (comme lancer deux dés), la variable aléatoire $X$ ne suit plus forcément une loi binomiale simple. Il faut alors établir sa **loi de probabilité** complète.\n\nOn définit ensuite la **Fonction de Répartition** $F$ qui donne la probabilité que le résultat soit inférieur ou égal à une valeur $x$ :\n$F(x) = P(X \\le x)$.\nC'est une fonction croissante qui part de $0$ et arrive à $1$, représentée par un graphique en « escalier ».\n\nEnfin, on calcule les indicateurs de position et de dispersion :\n- **Espérance $E(X)$** : le gain moyen.\n- **Variance $V(X)$** : la dispersion.\n- **Écart-type $\\sigma(X)$** : l'étendue du risque.",
                    "example": "**Situation : Somme de deux dés tétraédriques (4 faces)**\nOn lance deux dés à 4 faces et on note $X$ la somme.\n\n**1. Analyse de la Loi de Probabilité :**\nIl y a $4 \\times 4 = 16$ issues totales.\n- Somme = 2 : (1,1) -> 1 cas. $P(X=2) = 1/16$\n- Somme = 3 : (1,2), (2,1) -> 2 cas. $P(X=3) = 2/16$\n- Somme = 4 : (1,3), (2,2), (3,1) -> 3 cas. $P(X=4) = 3/16$\n- Somme = 5 : (1,4), (2,3), (3,2), (4,1) -> 4 cas. $P(X=5) = 4/16$\n- Somme = 6 : (2,4), (3,3), (4,2) -> 3 cas. $P(X=6) = 3/16$\n- Somme = 7 : (3,4), (4,3) -> 2 cas. $P(X=7) = 2/16$\n- Somme = 8 : (4,4) -> 1 cas. $P(X=8) = 1/16$\n\n**2. Calcul de l'Espérance $E(X)$ :**\n$E(X) = (2 \\times \\frac{1}{16}) + (3 \\times \\frac{2}{16}) + (4 \\times \\frac{3}{16}) + (5 \\times \\frac{4}{16}) + (6 \\times \\frac{3}{16}) + (7 \\times \\frac{2}{16}) + (8 \\times \\frac{1}{16})$\n$E(X) = \\frac{2 + 6 + 12 + 20 + 18 + 14 + 8}{16} = \\frac{80}{16} = 5$.\n\n**Résultat :** En moyenne, la somme obtenue sera de 5.",
                    "extras": [
                        "Exemple complet : Calcul de la fonction de répartition pour $X=3$.\n$F(3) = P(X \\le 3) = P(X=2) + P(X=3) = 1/16 + 2/16 = 3/16$.\nPour $x < 2$, $F(x) = 0$. Pour $x \\ge 8$, $F(x) = 1$.",
                        "Exemple complet : Calcul de la Variance pour les dés.\n$E(X^2) = (2^2 \\times 1/16) + \\dots + (8^2 \\times 1/16) = 440/16 = 27,5$.\n$V(X) = E(X^2) - [E(X)]^2 = 27,5 - 5^2 = 2,5$.",
                        "Exemple complet : Écart-type pour les dés.\n$\\sigma(X) = \\sqrt{V(X)} = \\sqrt{2,5} \\approx 1,58$.\nCela signifie que les résultats s'écartent en moyenne de 1,58 autour de la moyenne 5."
                    ]
                }
            ]



            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
