<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Limites – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =




            [
                {
                    "title": "Étape 1 : Analyse des Limites Infinies (Forme $\\frac{b}{0}$)",
                    "content": "Ce module traite de l'étude rigoureuse du comportement des fonctions rationnelles à proximité de leurs valeurs interdites. Lorsqu'en remplaçant $x$ par $a$ dans une fraction $\\frac{u(x)}{v(x)}$, on obtient un réel non nul au numérateur et $0$ au dénominateur, la limite est toujours infinie ($\\pm\\infty$).\n\n**Méthodologie de rédaction :**\n1. Identifier la valeur interdite $a$ et vérifier que le numérateur ne s'annule pas en $a$.\n2. Étudier le signe du dénominateur à gauche et à droite de $a$.\n3. Réécrire la limite en décomposant la fonction : $\\lim_{x \\to a} u(x) \\times \\frac{1}{v(x)}$.\n4. Appliquer la règle des signes pour conclure sur $+\\infty$ ou $-\\infty$.\n\n**Propriété fondamentale :**\n$\\lim_{x \\to a^+} \\frac{1}{x - a} = +\\infty$ et $\\lim_{x \\to a^-} \\frac{1}{x - a} = -\\infty$.\n\n**Interprétation graphique :**\nSi $\\lim_{x \\to a} f(x) = \\pm\\infty$, alors la droite d'équation $x = a$ est une asymptote verticale à la courbe $(C_f)$.",
                    "example": "Étude complète de $f(x) = \\frac{x^2 - 7}{x - 4}$ en $a = 4$ :\n\n**Analyse :**\nAu numérateur : $4^2 - 7 = 9$.\nAu dénominateur : $4 - 4 = 0$.\n\n**À gauche de 4 ($x < 4$) :**\n$\\lim_{x \\to 4^-} f(x) = \\lim_{x \\to 4^-} (x^2 - 7) \\times \\frac{1}{x - 4} = -\\infty$\nJustification : Car $\\lim_{x \\to 4^-} (x^2 - 7) = 9$ et $\\lim_{x \\to 4^-} \\frac{1}{x - 4} = -\\infty$.\n\n**À droite de 4 ($x > 4$) :**\n$\\lim_{x \\to 4^+} f(x) = \\lim_{x \\to 4^+} (x^2 - 7) \\times \\frac{1}{x - 4} = +\\infty$\nJustification : Car $\\lim_{x \\to 4^+} (x^2 - 7) = 9$ et $\\lim_{x \\to 4^+} \\frac{1}{x - 4} = +\\infty$.\n\n**Interprétation :**\nLa droite d'équation $x = 4$ est une asymptote verticale à $(C_f)$.",
                    "extras": [
                        "Exemple 2 : Soit $f(x) = \\frac{x^2 + 2x + 3}{x + 1}$ en $a = -1$.\nAu numérateur : $(-1)^2 + 2(-1) + 3 = 2$.\n$\\lim_{x \\to -1^-} f(x) = \\lim_{x \\to -1^-} (x^2 + 2x + 3) \\times \\frac{1}{x + 1} = -\\infty$ (car le dénominateur est $0^-$).\n$\\lim_{x \\to -1^+} f(x) = \\lim_{x \\to -1^+} (x^2 + 2x + 3) \\times \\frac{1}{x + 1} = +\\infty$ (car le dénominateur est $0^+$).\nAsymptote verticale : $x = -1$.",
                        "Exemple 3 : Soit $f(x) = \\frac{-2x + 3}{3x - 9}$ en $a = 3$.\nAu numérateur : $-2(3) + 3 = -3$.\n$\\lim_{x \\to 3^-} f(x) = \\lim_{x \\to 3^-} (-2x + 3) \\times \\frac{1}{3x - 9} = +\\infty$.\nJustification : Le numérateur tend vers $-3$ (négatif) et l'inverse du dénominateur vers $-\\infty$. Par produit : $+\\infty$.\n$\\lim_{x \\to 3^+} f(x) = \\lim_{x \\to 3^+} (-2x + 3) \\times \\frac{1}{3x - 9} = -\\infty$.\nAsymptote verticale : $x = 3$.",
                        "Exemple 4 : Soit $f(x) = \\frac{x + 1}{x - 1}$ en $a = 1$.\n$\\lim_{x \\to 1^-} f(x) = (2) \\times (-\\infty) = -\\infty$.\n$\\lim_{x \\to 1^+} f(x) = (2) \\times (+\\infty) = +\\infty$.\nLa droite $x = 1$ est une asymptote verticale."
                    ]
                },
                {
                    "title": "Étape 2 : Résolution de la Forme Indéterminée $\\frac{0}{0}$",
                    "content": "Lorsqu'on cherche la limite d'une fonction rationnelle en un point $a$ et que l'on obtient $\\frac{0}{0}$, on dit que l'on est face à une Forme Indéterminée (F.I.). Cela signifie que $a$ est une racine commune au numérateur et au dénominateur.\n\n**Règle de levée d'indétermination :**\nPour lever cette indétermination, il faut factoriser le numérateur et le dénominateur par $(x - a)$, simplifier l'expression par ce facteur commun, puis recalculer la limite avec l'expression simplifiée.\n\n**Outils de factorisation :**\n1. Facteur commun évident (ex: $x^2 + x = x(x+1)$).\n2. Identités remarquables (ex: $x^2 - 9 = (x-3)(x+3)$).\n3. Discriminant $Δ$ pour les trinômes du second degré ($ax^2+bx+c = a(x-x_1)(x-x_2)$).",
                    "example": "Étude de la limite en $x \\to -3$ de $f(x) = \\frac{x^2+5x+6}{x+3}$ :\n\n**Analyse au brouillon :**\nEn remplaçant par $-3$ : $\\frac{(-3)^2 + 5(-3) + 6}{-3 + 3} = \\frac{0}{0}$ (F.I.).\n\n**Étape 1 : Factorisation du numérateur.**\nCalcul du discriminant pour $x^2+5x+6$ :\n$Δ = 5^2 - 4(1)(6) = 1$.\nRacines : $x_1 = \\frac{-5 - 1}{2} = -3$ et $x_2 = \\frac{-5 + 1}{2} = -2$.\nD'où : $x^2+5x+6 = (x+3)(x+2)$.\n\n**Étape 2 : Simplification.**\nPour $x \\neq -3$, $f(x) = \\frac{(x+3)(x+2)}{x+3} = x + 2$.\n\n**Étape 3 : Calcul final.**\n$\\lim_{x \\to -3} f(x) = \\lim_{x \\to -3} (x+2) = -3 + 2 = -1$.\n\n**Conclusion :** $\\lim_{x \\to -3} f(x) = -1$.",
                    "extras": [
                        "Exemple 2 : Limite en $x \\to 0$ de $\\frac{x^2 + x}{x}$.\nAnalyse : $0/0$ en remplaçant $x$ par $0$.\nFactorisation : $\\frac{x(x + 1)}{x}$.\nSimplification : Pour $x \\neq 0$, $f(x) = x + 1$.\nLimite : $\\lim_{x \\to 0} (x + 1) = 0 + 1 = 1$.",
                        "Exemple 3 : Limite en $x \\to 3$ de $\\frac{x^2-x-6}{x^2-9}$.\nAnalyse : $3^2-3-6=0$ et $3^2-9=0$, donc F.I. $0/0$.\nFactorisation numérateur ($Δ=25$) : $(x-3)(x+2)$.\nFactorisation dénominateur : $(x-3)(x+3)$.\nSimplification : $\\frac{x+2}{x+3}$.\nLimite : $\\lim_{x \\to 3} \\frac{3+2}{3+3} = \\frac{5}{6}$.",
                        "Remarque importante : Toujours effectuer la simplification par le facteur $(x-a)$ avant de tenter de remplacer à nouveau $x$ par sa valeur, sinon l'indétermination persistera."
                    ]
                }
            ]


            ;


        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
