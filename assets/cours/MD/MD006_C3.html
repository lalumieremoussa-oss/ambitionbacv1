<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Limites – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =


            [
                {
                    "title": "Étape 1 : Intégrale de fonctions avec Logarithme (ln)",
                    "content": "Pour intégrer des fonctions contenant $\\ln(x)$, on utilise souvent l'Intégration Par Parties (IPP) :\n$\\int u v' = [uv] - \\int u'v$.\nOn pose généralement $u(x) = \\ln(x)$ car sa dérivée $1/x$ est plus simple à manipuler.",
                    "example": "Calculons $I = \\int_{1}^{e} \\ln(x) dx$ :\n\nOn pose :\n$u(x) = \\ln(x) \\implies u'(x) = \\frac{1}{x}$\n$v'(x) = 1 \\implies v(x) = x$\n\nApplication de l'IPP :\n$I = [x \\ln x]_{1}^{e} - \\int_{1}^{e} x \\times \\frac{1}{x} dx$\n$I = (e \\ln e - 1 \\ln 1) - \\int_{1}^{e} 1 dx$\n$I = (e - 0) - [x]_{1}^{e}$\n$I = e - (e - 1)$\n\nRésultat :\n$I = 1$.",
                    "extras": [
                        "Exemple 1 : $\\int_{1}^{e} x \\ln x dx$. IPP: $u=\\ln x, v'=x$. Résultat: $\\frac{e^2+1}{4}$.",
                        "Exemple 2 : $\\int_{1}^{2} \\frac{\\ln x}{x} dx = [\\frac{1}{2}(\\ln x)^2]_{1}^{2} = \\frac{1}{2}(\\ln 2)^2$.",
                        "Exemple 3 : $\\int_{e}^{e^2} \\frac{1}{x \\ln x} dx = [\\ln(\\ln x)]_{e}^{e^2} = \\ln 2 - \\ln 1 = \\ln 2$.",
                        "Exemple 4 : $\\int_{1}^{e} \\ln(2x) dx = [x\\ln(2x) - x]_{1}^{e} = e\\ln(2e) - e - (\\ln 2 - 1) = e\\ln 2 + 1 - \\ln 2$.",
                        "Exemple 5 : $\\int_{1}^{e} x^2 \\ln x dx$. IPP: $u=\\ln x, v'=x^2$. Résultat: $\\frac{2e^3+1}{9}$.",
                        "Exemple 6 : $\\int_{1}^{e} \\frac{(\\ln x)^2}{x} dx = [\\frac{1}{3}(\\ln x)^3]_{1}^{e} = \\frac{1}{3}$.",
                        "Exemple 7 : $\\int_{1}^{2} (1 + \\ln x) dx = [x \\ln x]_{1}^{2} = 2 \\ln 2$.",
                        "Exemple 8 : $\\int_{2}^{4} \\frac{dx}{x \\ln x} = [\\ln(\\ln x)]_{2}^{4} = \\ln(\\frac{\\ln 4}{\\ln 2}) = \\ln 2$.",
                        "Exemple 9 : $\\int_{1}^{e} \\frac{1}{x(1+\\ln x)} dx = [\\ln(1+\\ln x)]_{1}^{e} = \\ln 2$.",
                        "Exemple 10 : $\\int_{1}^{e} \\frac{\\ln(\\sqrt{x})}{x} dx = \\frac{1}{2}\\int_{1}^{e} \\frac{\\ln x}{x} dx = \\frac{1}{4}$."
                    ]
                },
                {
                    "title": "Étape 2 : Intégrale de fonctions Exponentielles (expo)",
                    "content": "La primitive de $e^x$ est $e^x$. Pour les formes composées :\n$\\int u'(x)e^{u(x)} dx = e^{u(x)} + C$.\nSi l'exposant est linéaire ($ax+b$), la primitive est $\\frac{1}{a}e^{ax+b}$.",
                    "example": "Calculons $J = \\int_{0}^{1} (x+2)e^x dx$ par IPP :\n\nOn pose :\n$u(x) = x+2 \\implies u'(x) = 1$\n$v'(x) = e^x \\implies v(x) = e^x$\n\nApplication :\n$J = [(x+2)e^x]_{0}^{1} - \\int_{0}^{1} e^x dx$\n$J = (3e^1 - 2e^0) - [e^x]_{0}^{1}$\n$J = 3e - 2 - (e - 1)$\n\nRésultat :\n$J = 2e - 1$.",
                    "extras": [
                        "Exemple 1 : $\\int_{0}^{\\ln 2} e^x dx = [e^x]_{0}^{\\ln 2} = 2 - 1 = 1$.",
                        "Exemple 2 : $\\int_{0}^{1} e^{2x} dx = [\\frac{1}{2}e^{2x}]_{0}^{1} = \\frac{e^2-1}{2}$.",
                        "Exemple 3 : $\\int_{0}^{1} xe^{x^2} dx = [\\frac{1}{2}e^{x^2}]_{0}^{1} = \\frac{e-1}{2}$.",
                        "Exemple 4 : $\\int_{0}^{1} e^{-x} dx = [-e^{-x}]_{0}^{1} = -e^{-1} + 1 = 1 - \\frac{1}{e}$.",
                        "Exemple 5 : $\\int_{1}^{2} e^{3x-3} dx = [\\frac{1}{3}e^{3x-3}]_{1}^{2} = \\frac{e^3-1}{3}$.",
                        "Exemple 6 : $\\int_{0}^{\\ln 3} e^{2x} dx = [\\frac{1}{2}e^{2x}]_{0}^{\\ln 3} = \\frac{9-1}{2} = 4$.",
                        "Exemple 7 : $\\int_{-1}^{1} e^{|x|} dx = 2\\int_{0}^{1} e^x dx = 2(e-1)$.",
                        "Exemple 8 : $\\int_{0}^{1} (e^x + x) dx = [e^x + \\frac{x^2}{2}]_{0}^{1} = (e+0,5) - 1 = e - 0,5$.",
                        "Exemple 9 : $\\int_{0}^{\\ln 2} e^{-x} dx = [-e^{-x}]_{0}^{\\ln 2} = -0,5 - (-1) = 0,5$.",
                        "Exemple 10 : $\\int_{0}^{1} \\frac{e^x}{e^x+1} dx = [\\ln(e^x+1)]_{0}^{1} = \\ln(e+1) - \\ln 2$."
                    ]
                },
                {
                    "title": "Étape 3 : Synthèse (Produits ln et expo)",
                    "content": "Cette étape combine les techniques précédentes. On y retrouve souvent des fonctions du type $f(x) = e^x \\ln x$ (rare au BAC sans indication) ou des fractions mêlant les deux.\nL'astuce est de bien identifier quelle partie est la dérivée de l'autre.",
                    "example": "Calculons $K = \\int_{1}^{e} \\frac{e^{\\ln x}}{x} dx$ :\n\nSimplification :\nOn sait que $e^{\\ln x} = x$.\nDonc $K = \\int_{1}^{e} \\frac{x}{x} dx = \\int_{1}^{e} 1 dx$.\n\nCalcul :\n$K = [x]_{1}^{e} = e - 1$.",
                    "extras": [
                        "Exemple 1 : $\\int_{1}^{2} e^x (1 + \\frac{1}{e^x}) dx = \\int (e^x + 1) dx = [e^x + x]_{1}^{2} = e^2 - e + 1$.",
                        "Exemple 2 : $\\int_{0}^{1} \\frac{e^x}{e^x+e} dx = [\\ln(e^x+e)]_{0}^{1} = \\ln(2e) - \\ln(1+e) = 1 + \\ln 2 - \\ln(1+e)$.",
                        "Exemple 3 : $\\int_{1}^{e} \\frac{1}{x} e^{\\ln x} dx = \\int_{1}^{e} 1 dx = e-1$.",
                        "Exemple 4 : $\\int_{0}^{1} e^{x+\\ln(x+1)} dx$ (vu comme $e^x(x+1)$) $= [xe^x]_{0}^{1} = e$.",
                        "Exemple 5 : $\\int_{1}^{e} \\frac{\\ln x + e^x}{x} dx = [\\frac{1}{2}(\\ln x)^2]_{1}^{e} + \\int \\frac{e^x}{x} dx$ (Expression laissée sous forme intégrale).",
                        "Exemple 6 : $\\int_{0}^{1} e^x \\ln(e) dx = \\int e^x dx = e-1$.",
                        "Exemple 7 : $\\int_{1}^{2} \\frac{e^x}{e^x} dx = 1$.",
                        "Exemple 8 : $\\int_{0}^{1} (e^x)^2 dx = \\int e^{2x} dx = \\frac{e^2-1}{2}$.",
                        "Exemple 9 : $\\int_{1}^{e} \\frac{1}{x e^{\\ln x}} dx = \\int \\frac{1}{x^2} dx = 1 - 1/e$.",
                        "Exemple 10 : $\\int_{0}^{1} e^{x} \\times e^{-x} dx = \\int 1 dx = 1$."
                    ]
                }
            ]



            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
