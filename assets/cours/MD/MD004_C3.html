<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Limites – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =




            [
                {
                    "title": "Étape 1 : Les Limites Fondamentales et Applications Directes",
                    "content": "Le calcul des limites de la fonction logarithme népérien ($ln$) est essentiel pour étudier le comportement d'une fonction aux bornes de son ensemble de définition. Il existe six limites de référence qu'il faut impérativement maîtriser pour lever les indéterminations.\n\n**1. Limites aux bornes de $]0 ; +\infty[$ :**\n- En zéro : $\\lim_{x \\to 0^+} ln(x) = -\\infty$\n- En l'infini : $\\lim_{x \\to +\\infty} ln(x) = +\\infty$\n\n**2. Croissances comparées (le terme de puissance l'emporte sur le $ln$) :**\n- $\\lim_{x \\to +\\infty} \\frac{ln(x)}{x^n} = 0$ ($n > 0$)\n- $\\lim_{x \\to 0^+} x^n ln(x) = 0$ ($n > 0$)\n\n**3. Limites liées au nombre dérivé :**\n- $\\lim_{x \\to 1} \\frac{ln(x)}{x-1} = 1$\n- $\\lim_{x \\to 0} \\frac{ln(x+1)}{x} = 1$\n\nLorsqu'on est face à une somme, un produit ou un quotient sans indétermination, on applique directement ces résultats.",
                    "example": "Calculons la limite de $f(x) = x + ln(x)$ en $+\infty$ :\n\n**Analyse :**\nOn sait que $\\lim_{x \\to +\\infty} x = +\\infty$.\nOn sait que $\\lim_{x \\to +\\infty} ln(x) = +\\infty$.\n\n**Calcul :**\nPar somme de limites de même signe :\n$\\lim_{x \\to +\\infty} (x + ln(x)) = +\\infty$.\n\n**Conclusion :**\nLa courbe de $f$ admet une branche infinie en $+\infty$.",
                    "extras": [
                        "Exemple complet : Calculer $\\lim_{x \\to 0^+} \\frac{3}{ln(x)}$.\nOn a $\\lim_{x \\to 0^+} ln(x) = -\\infty$.\nPar quotient d'une constante par l'infini, on obtient : $\\lim_{x \\to 0^+} \\frac{3}{ln(x)} = 0$.",
                        "Exemple complet : Calculer $\\lim_{x \\to 0^+} (x^2 + 1)ln(x)$.\n$\\lim_{x \\to 0^+} (x^2 + 1) = 1$ et $\\lim_{x \\to 0^+} ln(x) = -\\infty$.\nPar produit : $1 \\times (-\\infty) = -\\infty$.",
                        "Exemple complet : Calculer $\\lim_{x \\to +\\infty} \\frac{1}{x} - ln(x)$.\n$\\lim_{x \\to +\\infty} \\frac{1}{x} = 0$ et $\\lim_{x \\to +\\infty} ln(x) = +\\infty$.\nPar différence : $0 - (+\\infty) = -\\infty$."
                    ]
                },
                {
                    "title": "Étape 2 : Levée d'Indéterminations par Factorisation et Croissances Comparées",
                    "content": "On rencontre souvent des Formes Indéterminées (FI) du type $\\infty - \\infty$ ou $0 \\times \\infty$. La méthode la plus efficace consiste à factoriser par le terme prépondérant (le plus 'fort').\n\nEn $+\infty$, la fonction $x$ (ou $x^n$) est plus forte que $ln(x)$. On force donc la factorisation par $x$ pour faire apparaître la limite de référence $\\frac{ln(x)}{x}$ qui tend vers $0$.\n\nEn $0^+$, on utilise la propriété $x^n ln(x) = 0$ pour neutraliser l'influence du logarithme qui tend vers $-\\infty$.",
                    "example": "Calculons la limite de $f(x) = x - ln(x)$ en $+\infty$ :\n\n**Analyse :**\n$\\lim_{x \\to +\\infty} x = +\\infty$ et $\\lim_{x \\to +\\infty} -ln(x) = -\\infty$.\nOn a une forme indéterminée (FI) du type $\\infty - \\infty$.\n\n**Résolution :**\nOn factorise par le terme le plus fort, ici $x$ :\n$x - ln(x) = x(1 - \\frac{ln(x)}{x})$\n\nOr, par croissance comparée, $\\lim_{x \\to +\\infty} \\frac{ln(x)}{x} = 0$.\nL'expression dans la parenthèse $(1 - \\frac{ln(x)}{x})$ tend donc vers $1-0 = 1$.\n\n**Calcul final :**\n$\\lim_{x \\to +\\infty} x \\times 1 = +\\infty$.",
                    "extras": [
                        "Exemple complet : Calculer $\\lim_{x \\to +\\infty} \\frac{1 - ln(x)}{x}$.\nOn sépare la fraction : $\\frac{1}{x} - \\frac{ln(x)}{x}$.\n$\\lim_{x \\to +\\infty} \\frac{1}{x} = 0$ et $\\lim_{x \\to +\\infty} \\frac{ln(x)}{x} = 0$.\nPar différence, la limite est $0$.",
                        "Exemple complet : Calculer $\\lim_{x \\to 0^+} x(1 - ln(x))$.\nOn développe l'expression : $x - x ln(x)$.\n$\\lim_{x \\to 0^+} x = 0$ et $\\lim_{x \\to 0^+} x ln(x) = 0$ (limite de référence).\nPar différence : $0 - 0 = 0$.",
                        "Exemple complet : Calculer $\\lim_{x \\to +\\infty} 5x + 3 - 4ln(x)$.\nOn factorise par $x$ : $x(5 + \\frac{3}{x} - 4\\frac{ln(x)}{x})$.\nDans la parenthèse : $\\frac{3}{x} \\to 0$ et $\\frac{ln(x)}{x} \\to 0$.\nIl reste $\\lim_{x \\to +\\infty} x \\times 5 = +\\infty$."
                    ]
                },
                {
                    "title": "Étape 3 : Limites Composées et Changements de Variables",
                    "content": "Pour calculer la limite de $ln(u(x))$, on utilise le théorème de composition des limites :\n1. On calcule la limite de $u(x)$ quand $x \\to a$.\n2. On appelle $L$ ce résultat.\n3. La limite finale est $ln(L)$ (si $L > 0$) ou $\\pm \\infty$ (si $L = 0$ ou $+\\infty$).\n\nSi la composition mène à une forme indéterminée, on peut effectuer un changement de variable (poser $X = u(x)$) ou utiliser les limites de référence liées au taux d'accroissement (nombre dérivé).",
                    "example": "Calculons la limite de $f(x) = ln(\\frac{2x+1}{x-3})$ en $+\infty$ :\n\n**1. Limite de la fonction intérieure :**\nIl s'agit d'une fonction rationnelle. En $+\infty$, on prend le rapport des termes de plus haut degré :\n$\\lim_{x \\to +\\infty} \\frac{2x+1}{x-3} = \\lim_{x \\to +\\infty} \\frac{2x}{x} = 2$.\n\n**2. Composition avec le logarithme :**\nComme la limite intérieure tend vers $2$, on applique le logarithme à ce résultat.\n$\\lim_{X \\to 2} ln(X) = ln(2)$.\n\n**Conclusion :**\n$\\lim_{x \\to +\\infty} ln(\\frac{2x+1}{x-3}) = ln(2)$.",
                    "extras": [
                        "Exemple complet : Calculer $\\lim_{x \\to 2^+} ln(x-2)$.\nPosons $X = x-2$. Quand $x \\to 2^+$, alors $X \\to 0^+$.\nOr $\\lim_{X \\to 0^+} ln(X) = -\\infty$. La limite est donc $-\\infty$.",
                        "Exemple complet : Calculer $\\lim_{x \\to +\\infty} x ln(1 + \\frac{1}{x})$.\nPosons $X = \\frac{1}{x}$. Quand $x \\to +\\infty$, $X \\to 0$.\nL'expression devient $\\frac{1}{X} ln(1+X) = \\frac{ln(1+X)}{X}$.\nD'après la limite de référence (taux d'accroissement en 0), le résultat est $1$.",
                        "Exemple complet : Calculer $\\lim_{x \\to 0^+} \\frac{ln(x)}{x + ln(x)}$.\nOn factorise par $ln(x)$ : $\\frac{ln(x)}{ln(x) (\\frac{x}{ln(x)} + 1)} = \\frac{1}{\\frac{x}{ln(x)} + 1}$.\nComme $\\frac{x}{ln(x)} \\to \\frac{0}{-\\infty} = 0$, la limite devient $\\frac{1}{0+1} = 1$."
                    ]
                }
            ]
            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
