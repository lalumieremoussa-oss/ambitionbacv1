<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Limites – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =



            [
                {
                    "title": "Étape unique : Calcul de limites à l'infini des fonctions polynômes, rationnelles et irrationnelles",
                    "content": "L'étude des limites à l'infini permet de comprendre le comportement asymptotique d'une fonction aux extrémités de son domaine.\n\n**1. Fonctions Polynômes et Rationnelles : Règle du plus haut degré**\nPour lever les formes indéterminées $\\infty - \\infty$ ou $\\frac{\\infty}{\\infty}$ dans ces fonctions, on applique la règle suivante :\n*   La limite d'un polynôme à l'infini est égale à la limite de son monôme de plus haut degré.\n*   La limite d'une fonction rationnelle à l'infini est égale à la limite du rapport des monômes de plus haut degré du numérateur et du dénominateur.\n\n**Propriétés fondamentales :**\n*   $\\lim_{x \\to \\pm\\infty} \\frac{1}{x^n} = 0$ (pour $n \\in \\mathbb{N}^*$)\n*   $\\lim_{x \\to -\\infty} x^n = +\\infty$ si $n$ est pair, et $-\\infty$ si $n$ est impair.\n\n**2. Fonctions Irrationnelles : Expression Conjuguée**\nLorsque la règle du plus haut degré ne suffit pas (souvent pour des formes $\\infty - \\infty$ avec des racines carrées), on utilise l'expression conjuguée.\nOn multiplie et on divise par la quantité conjuguée pour utiliser l'identité $(a-b)(a+b) = a^2 - b^2$, puis on factorise par le terme dominant pour conclure.",
                    "example": "Étudions $\\lim_{x \\to +\\infty} (\\sqrt{x^2 + 5x + 2} - x + 4)$ :\n\n**Analyse :**\nOn a une forme $\\infty - \\infty$. Réécrivons l'expression : $\\sqrt{x^2+5x+2} - (x-4)$.\n\n**Étape 1 : Expression conjuguée.**\nMultiplions par $\\sqrt{x^2+5x+2} + (x-4)$ :\n$f(x) = \\frac{(\\sqrt{x^2+5x+2}-(x-4))(\\sqrt{x^2+5x+2}+(x-4))}{\\sqrt{x^2+5x+2}+(x-4)}$\n$f(x) = \\frac{(x^2+5x+2)-(x-4)^2}{\\sqrt{x^2+5x+2}+x-4}$\n\n**Étape 2 : Développement du numérateur.**\n$(x-4)^2 = x^2 - 8x + 16$.\n$f(x) = \\frac{x^2+5x+2 - (x^2-8x+16)}{\\sqrt{x^2+5x+2}+x-4} = \\frac{13x - 14}{\\sqrt{x^2+5x+2}+x-4}$\n\n**Étape 3 : Factorisation par le terme dominant ($x$).**\n$f(x) = \\frac{x(13 - \\frac{14}{x})}{x(\\sqrt{1+\\frac{5}{x}+\\frac{2}{x^2}} + 1 - \\frac{4}{x})}$\nEn simplifiant par $x$ : $f(x) = \\frac{13 - \\frac{14}{x}}{\\sqrt{1+\\frac{5}{x}+\\frac{2}{x^2}} + 1 - \\frac{4}{x}}$\n\n**Calcul final :**\n$\\lim_{x \\to +\\infty} f(x) = \\frac{13 - 0}{\\sqrt{1+0+0} + 1 - 0} = \\frac{13}{1+1} = \\frac{13}{2} = 6,5$.",
                    "extras": [
                        "Exemple 1 (Rationnelle) : $\\lim_{x \\to -\\infty} \\frac{x^2 + x + 1}{x - 2}$.\nOn prend les plus hauts degrés : $\\lim_{x \\to -\\infty} \\frac{x^2}{x} = \\lim_{x \\to -\\infty} x$.\nLe résultat est $-\\infty$.",
                        "Exemple 2 (Rationnelle) : $\\lim_{x \\to +\\infty} \\frac{x^2 + x + 1}{x^2 - 2x}$.\nOn prend les plus hauts degrés : $\\lim_{x \\to +\\infty} \\frac{x^2}{x^2} = \\lim_{x \\to +\\infty} 1$.\nLe résultat est $1$.",
                        "Exemple 3 (Polynôme) : $\\lim_{x \\to -\\infty} (x^2 - x + 2)$.\nLa limite est celle du terme de plus haut degré : $\\lim_{x \\to -\\infty} x^2$.\nComme l'exposant est pair, le résultat est $+\\infty$.",
                        "Exemple 4 (Irrati. $\\infty - \\infty$) : $f(x) = \\sqrt{3x + 5} - x$ en $+\\infty$.\nConjugué : $\\frac{(3x+5)-x^2}{\\sqrt{3x+5}+x}$.\nFactorisation par $x^2$ au numérateur et $x$ au dénominateur :\n$f(x) = x \\times \\frac{\\frac{3}{x} + \\frac{5}{x^2} - 1}{\\sqrt{\\frac{3}{x} + \\frac{5}{x^2}} + 1}$.\nCalcul : $(+\\infty) \\times \\frac{-1}{1} = -\\infty$.",
                        "Exemple 5 (Irrati. $\\infty - \\infty$) : $f(x) = \\sqrt{x + 1} - \\sqrt{x}$ en $+\\infty$.\nConjugué : $\\frac{(x+1)-x}{\\sqrt{x+1}+\\sqrt{x}} = \\frac{1}{\\sqrt{x+1}+\\sqrt{x}}$.\nLe dénominateur tend vers $+\\infty$, donc $\\lim_{x \\to +\\infty} f(x) = 0$.",
                        "Exemple 6 (Irrati. Quotient) : $f(x) = \\frac{\\sqrt{x^2 + 1} + 2x}{x}$ en $+\\infty$.\nOn factorise $x$ dans la racine : $\\sqrt{x^2(1+\\frac{1}{x^2})} = |x|\\sqrt{1+\\frac{1}{x^2}}$.\nEn $+\\infty$, $|x| = x$, donc $f(x) = \\frac{x\\sqrt{1+\\frac{1}{x^2}} + 2x}{x} = \\sqrt{1+\\frac{1}{x^2}} + 2$.\nCalcul : $\\sqrt{1} + 2 = 3$."
                    ]
                }
            ]


            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
