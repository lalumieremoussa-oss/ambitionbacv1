<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Limites – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =



            [
                {
                    "title": "Étape 1 : Démonstration qu'une suite est géométrique ($V_n = U_n - \alpha$)",
                    "content": "Pour démontrer qu'une suite $(V_n)$ est géométrique, on doit montrer qu'il existe un nombre réel $q$ (la raison) tel que pour tout entier naturel $n$, on a la relation : $V_{n+1} = q \times V_n$.\nDans le cas d'une suite auxiliaire liée à une suite arithmético-géométrique $U_{n+1} = aU_n + b$, on exprime $V_{n+1}$ en fonction de $U_{n+1}$, puis on remplace $U_{n+1}$ par sa définition pour factoriser par la raison.\nCette méthode permet de transformer une structure additive complexe en une structure multiplicative plus simple à étudier.",
                    "example": "Soit la suite $(U_n)$ définie par $U_0 = 5$ et $U_{n+1} = 3U_n - 4$.\nOn pose la suite $(V_n)$ définie par $V_n = U_n - 2$.\nDémontrons que $(V_n)$ est une suite géométrique :\n\nCalcul de $V_{n+1}$ :\n$V_{n+1} = U_{n+1} - 2$\n$V_{n+1} = (3U_n - 4) - 2$\n$V_{n+1} = 3U_n - 6$\nEn factorisant par 3 :\n$V_{n+1} = 3(U_n - 2)$\nComme $V_n = U_n - 2$, on a : $V_{n+1} = 3V_n$.\n\nConclusion :\n$(V_n)$ est une suite géométrique de raison $q = 3$.\nCalcul du premier terme $V_0$ :\n$V_0 = U_0 - 2 = 5 - 2 = 3$.",
                    "extras": [
                        "Exemple complet : Soit $U_{n+1} = 0,5U_n + 4$ avec $U_0 = 10$. On pose $V_n = U_n - 8$.\n$V_{n+1} = U_{n+1} - 8 = 0,5U_n + 4 - 8 = 0,5U_n - 4 = 0,5(U_n - 8) = 0,5V_n$.\nLa suite $(V_n)$ est géométrique de raison $q = 0,5$ et de premier terme $V_0 = 10 - 8 = 2$.",
                        "Exemple complet : Soit $U_{n+1} = 2U_n + 5$ avec $U_0 = -1$. On pose $V_n = U_n + 5$.\n$V_{n+1} = U_{n+1} + 5 = (2U_n + 5) + 5 = 2U_n + 10 = 2(U_n + 5) = 2V_n$.\nLa suite $(V_n)$ est géométrique de raison $q = 2$ et de premier terme $V_0 = -1 + 5 = 4$.",
                        "Exemple financier : On place $V_0 = 1000$ F CFA sur un compte avec un taux d'intérêt de $5\\%$ par an.\nChaque année, le capital est multiplié par $(1 + \\frac{5}{100}) = 1,05$.\n$V_{n+1} = 1,05 V_n$.\nLa suite du capital est géométrique de raison $q = 1,05$."
                    ]
                },
                {
                    "title": "Étape 2 : Formule explicite et expression en fonction de $n$",
                    "content": "Une fois qu'une suite $(V_n)$ est identifiée comme géométrique de raison $q$ et de premier terme $V_0$, on peut exprimer n'importe quel terme directement en fonction de $n$ sans connaître le terme précédent.\nLa formule générale est : $V_n = V_0 \\times q^n$.\nSi la suite commence à un rang $p$ quelconque, la formule devient : $V_n = V_p \\times q^{n-p}$.\nDans le cas d'une suite $U_n$ liée à $V_n$, on utilise la relation de départ pour isoler $U_n$ et obtenir son expression explicite : $U_n = V_n + \\alpha$.",
                    "example": "Reprenons la suite de l'étape 1 où $V_n$ est géométrique de raison $q = 3$ et $V_0 = 3$, avec $V_n = U_n - 2$.\n\nExpression de $V_n$ en fonction de $n$ :\n$V_n = V_0 \\times q^n$\n$V_n = 3 \\times 3^n = 3^{n+1}$.\n\nDéduction de $U_n$ en fonction de $n$ :\nComme $V_n = U_n - 2$, alors $U_n = V_n + 2$.\nEn remplaçant $V_n$ par son expression :\n$U_n = 3^{n+1} + 2$.\n\nCalcul de $U_5$ :\n$U_5 = 3^{5+1} + 2 = 3^6 + 2 = 729 + 2 = 731$.",
                    "extras": [
                        "Exemple complet : Soit $V_n$ géométrique avec $V_0 = 100$ et $q = 0,8$.\nL'expression explicite est $V_n = 100 \\times (0,8)^n$.\nPour $n = 3$, $V_3 = 100 \\times 0,8^3 = 100 \\times 0,512 = 51,2$.",
                        "Exemple complet : Soit $U_n$ telle que $U_n = V_n + 8$ avec $V_n = 2 \\times (0,5)^n$.\nL'expression de la suite $U$ est $U_n = 2 \\times (0,5)^n + 8$.\nQuand $n$ tend vers $+\\infty$, $U_n$ tend vers 8 car $(0,5)^n$ tend vers 0.",
                        "Exemple financier : Un investissement de $5000$ F CFA avec un taux de $10\\%$ (raison $1,1$).\nExpression en fonction de $n$ : $C_n = 5000 \\times (1,1)^n$.\nAu bout de 2 ans : $C_2 = 5000 \\times 1,21 = 6050$ F CFA."
                    ]
                },
                {
                    "title": "Étape 3 : Somme des $n$ premiers termes d'une suite géométrique",
                    "content": "La somme $S_n$ des termes consécutifs d'une suite géométrique de raison $q \\neq 1$ est donnée par la formule :\n$S = \\text{Premier terme} \\times \\frac{1 - q^{\\text{nombre de termes}}}{1 - q}$.\nPour une somme allant de $V_0$ à $V_{n-1}$, il y a $n$ termes : $S_n = V_0 \\times \\frac{1 - q^n}{1 - q}$.\nPour une somme allant de $V_0$ à $V_n$, il y a $n+1$ termes : $S = V_0 \\times \\frac{1 - q^{n+1}}{1 - q}$.\nSi $q = 1$, la suite est constante et la somme vaut simplement $n \\times V_0$.",
                    "example": "Calculons la somme $S = V_0 + V_1 + V_2 + ... + V_9$ pour la suite géométrique de raison $q = 3$ et $V_0 = 3$ :\n\nNombre de termes :\nDe $0$ à $9$, il y a $9 - 0 + 1 = 10$ termes.\n\nApplication de la formule :\n$S = 3 \\times \\frac{1 - 3^{10}}{1 - 3}$\n$S = 3 \\times \\frac{1 - 59049}{-2}$\n$S = 3 \\times \\frac{-59048}{-2}$\n$S = 3 \\times 29524$\n$S = 88572$.",
                    "extras": [
                        "Exemple complet : Somme des 5 premiers termes de $V_n = 10 \\times 2^n$.\n$S = V_0 + V_1 + V_2 + V_3 + V_4 = 10 \\times \\frac{1 - 2^5}{1 - 2} = 10 \\times \\frac{-31}{-1} = 310$.",
                        "Exemple complet : Soit $V_n$ de raison $q = 0,5$ et $V_0 = 64$. Calculer $V_0 + ... + V_5$ (6 termes).\n$S = 64 \\times \\frac{1 - (0,5)^6}{1 - 0,5} = 64 \\times \\frac{1 - 0,015625}{0,5} = 64 \\times 1,96875 = 126$.",
                        "Exemple de gain cumulé : Un épargnant dépose chaque mois une somme qui augmente de $2\\%$ (raison $1,02$). S'il commence à $1000$ F CFA, le total après 12 mois est :\n$S = 1000 \\times \\frac{1 - 1,02^{12}}{1 - 1,02} \\approx 1000 \\times 13,41 = 13412$ F CFA."
                    ]
                }
            ]


            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
