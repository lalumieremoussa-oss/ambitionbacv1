<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Limites – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =

            [
                {
                    "title": "Étape 1 : Calcul des premiers termes d'une suite",
                    "content": "Le calcul des termes d'une suite dépend de son mode de définition.\nPour une suite explicite $u_n = f(n)$, on remplace $n$ par l'indice souhaité.\nPour une suite récurrente $u_{n+1} = f(u_n)$, le calcul d'un terme nécessite la connaissance du terme précédent.\nIl est fondamental de ne pas confondre l'indice $n$ et la valeur du terme $u_n$.",
                    "example": "Soit la suite $(u_n)$ définie par $u_0 = 2$ et $u_{n+1} = 3u_n - 4$ :\n\nCalculons $u_1$ :\n$u_1 = 3u_0 - 4$\n$u_1 = 3(2) - 4 = 6 - 4 = 2$\n\nCalculons $u_2$ :\n$u_2 = 3u_1 - 4$\n$u_2 = 3(2) - 4 = 2$\n\nOn remarque ici que la suite semble constante.",
                    "extras": [
                        "Exemple complet : Soit $v_n = n^2 - 3n + 1$.\n$v_0 = 0^2 - 3(0) + 1 = 1$\n$v_1 = 1^2 - 3(1) + 1 = -1$\n$v_2 = 2^2 - 3(2) + 1 = 4 - 6 + 1 = -1$\n$v_3 = 3^2 - 3(3) + 1 = 9 - 9 + 1 = 1$.",
                        "Exemple complet : Soit $w_{n+1} = \\sqrt{w_n + 2}$ avec $w_0 = 2$.\n$w_1 = \\sqrt{2 + 2} = \\sqrt{4} = 2$\n$w_2 = \\sqrt{2 + 2} = 2$.",
                        "Exemple complet : Suite définie par $u_n = \\frac{2n-1}{n+1}$.\n$u_0 = \\frac{-1}{1} = -1$\n$u_1 = \\frac{2(1)-1}{1+1} = \\frac{1}{2}$\n$u_{10} = \\frac{2(10)-1}{10+1} = \\frac{19}{11}$.",
                        "Exemple complet : Suite de Fibonacci $u_{n+2} = u_{n+1} + u_n$ avec $u_0=0, u_1=1$.\n$u_2 = 1 + 0 = 1$\n$u_3 = 1 + 1 = 2$\n$u_4 = 2 + 1 = 3$\n$u_5 = 3 + 2 = 5$.",
                        "Exemple complet : Soit $u_n = 2^n - n$.\n$u_0 = 2^0 - 0 = 1$\n$u_1 = 2^1 - 1 = 1$\n$u_2 = 2^2 - 2 = 2$\n$u_3 = 2^3 - 3 = 5$.",
                        "Exemple complet : Soit $u_{n+1} = \\frac{u_n}{1+u_n}$ avec $u_0 = 1$.\n$u_1 = \\frac{1}{1+1} = \\frac{1}{2}$\n$u_2 = \\frac{1/2}{1 + 1/2} = \\frac{1/2}{3/2} = \\frac{1}{3}$.",
                        "Exemple complet : Soit $u_n = \\cos(n\\pi)$.\n$u_0 = \\cos(0) = 1$\n$u_1 = \\cos(\\pi) = -1$\n$u_2 = \\cos(2\\pi) = 1$.",
                        "Exemple complet : Suite arithmétique $u_n = 5 + 3n$.\n$u_0 = 5$\n$u_1 = 8$\n$u_2 = 11$\n$u_{100} = 5 + 3(100) = 305$.",
                        "Exemple complet : Suite géométrique $u_n = 3 \\times 2^n$.\n$u_0 = 3$\n$u_1 = 6$\n$u_2 = 12$\n$u_5 = 3 \\times 32 = 96$.",
                        "Exemple complet : Soit $u_{n+1} = u_n^2 - 1$ avec $u_0 = 1$.\n$u_1 = 1^2 - 1 = 0$\n$u_2 = 0^2 - 1 = -1$\n$u_3 = (-1)^2 - 1 = 0$."
                    ]
                },
                {
                    "title": "Étape 2 : Démonstration par récurrence",
                    "content": "La démonstration par récurrence permet de prouver qu'une propriété $P(n)$ est vraie pour tout $n \\in \\mathbb{N}$.\nElle se déroule en trois phases :\n1. Initialisation : On vérifie que $P(n_0)$ est vraie.\n2. Hérédité : On suppose que $P(n)$ est vraie pour un certain $n$ (hypothèse de récurrence) et on montre que $P(n+1)$ est alors vraie.\n3. Conclusion : On conclut que la propriété est vraie pour tout $n$.",
                    "example": "Montrons par récurrence que pour tout $n \\in \\mathbb{N}$, la suite définie par $u_0 = 0$ et $u_{n+1} = 2u_n + 1$ vérifie $u_n = 2^n - 1$ :\n\nInitialisation :\nPour $n=0$, $u_0 = 0$ et $2^0 - 1 = 1 - 1 = 0$. La propriété est vraie au rang $0$.\n\nHérédité :\nSupposons qu'il existe un entier $n$ tel que $u_n = 2^n - 1$.\nMontrons que $u_{n+1} = 2^{n+1} - 1$.\n$u_{n+1} = 2u_n + 1$\nD'après l'hypothèse :\n$u_{n+1} = 2(2^n - 1) + 1$\n$u_{n+1} = 2^{n+1} - 2 + 1$\n$u_{n+1} = 2^{n+1} - 1$.\nL'hérédité est vérifiée.\n\nConclusion :\nPour tout $n \\in \\mathbb{N}$, $u_n = 2^n - 1$.",
                    "extras": [
                        "Exemple complet : Montrer que $u_n > 0$ pour $u_{n+1} = \\frac{1}{2}u_n + 3$ et $u_0 = 1$.\nInitialisation : $u_0 = 1 > 0$ (vrai).\nHérédité : Si $u_n > 0$, alors $\\frac{1}{2}u_n > 0$ et $\\frac{1}{2}u_n + 3 > 3 > 0$. Donc $u_{n+1} > 0$.",
                        "Exemple complet : Montrer que $2^n > n$ pour tout $n \\in \\mathbb{N}$.\nInitialisation : $2^0 = 1 > 0$ (vrai).\nHérédité : Supposons $2^n > n$. Alors $2^{n+1} = 2 \\times 2^n > 2n$. Comme $2n = n + n$ et $n \\geq 1$, alors $2n \\geq n+1$.",
                        "Exemple complet : Montrer que $u_n$ est majorée par 4 pour $u_{n+1} = \\sqrt{u_n + 12}$ avec $u_0 = 2$.\nInitialisation : $2 < 4$.\nHérédité : Si $u_n < 4$, alors $u_n + 12 < 16$, donc $\\sqrt{u_n + 12} < \\sqrt{16} = 4$.",
                        "Exemple complet : Montrer que $1 + 2 + ... + n = \\frac{n(n+1)}{2}$.\nInitialisation pour $n=1$ : $1 = \\frac{1(2)}{2}$ (vrai).\nHérédité : $\\frac{n(n+1)}{2} + (n+1) = (n+1)(\\frac{n}{2} + 1) = \\frac{(n+1)(n+2)}{2}$.",
                        "Exemple complet : Montrer que $u_n = 3 \\times 5^n$ pour $u_{n+1} = 5u_n$ et $u_0 = 3$.\nInitialisation : $u_0 = 3 \\times 5^0 = 3$.\nHérédité : $u_{n+1} = 5(3 \\times 5^n) = 3 \\times 5^{n+1}$.",
                        "Exemple complet : Montrer que $n! \\geq 2^{n-1}$ pour $n \\geq 1$.\nInitialisation : $1! = 1$ et $2^{1-1} = 1$.\nHérédité : $(n+1)! = (n+1) \\times n! \\geq (n+1) \\times 2^{n-1}$. Comme $n+1 \\geq 2$, alors $(n+1)! \\geq 2 \\times 2^{n-1} = 2^n$.",
                        "Exemple complet : Montrer que $9^n - 1$ est divisible par 8.\nInitialisation : $9^0 - 1 = 0$ divisible par 8.\nHérédité : $9^{n+1} - 1 = 9 \\times 9^n - 1 = 9(9^n - 1) + 8$. Comme $9^n-1$ est mult. de 8, la somme l'est aussi.",
                        "Exemple complet : Montrer que $u_n < 1$ pour $u_{n+1} = \\frac{1}{4-u_n}$ avec $u_0 = 0$.\nInitialisation : $0 < 1$.\nHérédité : $u_n < 1 \\implies -u_n > -1 \\implies 4-u_n > 3 \\implies \\frac{1}{4-u_n} < \\frac{1}{3} < 1$.",
                        "Exemple complet : Montrer que $u_n = u_0 + nr$ pour une suite arithmétique.\nInitialisation : $u_0 = u_0 + 0r$.\nHérédité : $u_{n+1} = u_n + r = (u_0 + nr) + r = u_0 + (n+1)r$.",
                        "Exemple complet : Montrer que $u_n \\geq 2$ pour $u_{n+1} = u_n^2 - 2$ avec $u_0 = 2$.\nInitialisation : $2 \\geq 2$.\nHérédité : $u_n \\geq 2 \\implies u_n^2 \\geq 4 \\implies u_n^2 - 2 \\geq 2$."
                    ]
                },
                {
                    "title": "Étape 3 : Détermination de la variation d'une suite",
                    "content": "Étudier la variation d'une suite consiste à déterminer si elle est croissante, décroissante ou constante.\nPlusieurs méthodes existent :\n1. Étude du signe de la différence : $u_{n+1} - u_n$.\n2. Comparaison du rapport à 1 (si $u_n > 0$) : $\\frac{u_{n+1}}{u_n}$.\n3. Étude de la fonction associée : $u_n = f(n)$.\n4. Par récurrence, pour les suites $u_{n+1} = f(u_n)$.",
                    "example": "Étudions la variation de la suite $u_n = \\frac{n}{n+1}$ :\n\nCalculons $u_{n+1} - u_n$ :\n$u_{n+1} - u_n = \\frac{n+1}{n+2} - \\frac{n}{n+1}$\n$u_{n+1} - u_n = \\frac{(n+1)^2 - n(n+2)}{(n+2)(n+1)}$\n$u_{n+1} - u_n = \\frac{n^2 + 2n + 1 - n^2 - 2n}{(n+2)(n+1)}$\n$u_{n+1} - u_n = \\frac{1}{(n+2)(n+1)}$\n\nComme $n \\geq 0$, le dénominateur est positif, donc $u_{n+1} - u_n > 0$.\nLa suite $(u_n)$ est strictement croissante.",
                    "extras": [
                        "Exemple complet : $u_n = 2n + 3$.\n$u_{n+1} - u_n = (2(n+1)+3) - (2n+3) = 2 > 0$. Croissante.",
                        "Exemple complet : $u_n = \\frac{1}{n+1}$.\n$u_{n+1} - u_n = \\frac{1}{n+2} - \\frac{1}{n+1} = \\frac{(n+1)-(n+2)}{(n+2)(n+1)} = \\frac{-1}{(n+2)(n+1)} < 0$. Décroissante.",
                        "Exemple complet : $u_n = 3^n$ (avec $u_n > 0$).\n$\\frac{u_{n+1}}{u_n} = \\frac{3^{n+1}}{3^n} = 3 > 1$. Croissante.",
                        "Exemple complet : $u_n = -n^2$.\nSoit $f(x) = -x^2$. $f'(x) = -2x < 0$ sur $\\mathbb{R}^+$. Décroissante.",
                        "Exemple complet : $u_{n+1} = u_n + n^2 + 1$.\n$u_{n+1} - u_n = n^2 + 1 > 0$. Croissante.",
                        "Exemple complet : $u_n = (\\frac{1}{2})^n$.\n$\\frac{u_{n+1}}{u_n} = \\frac{1}{2} < 1$. Décroissante.",
                        "Exemple complet : $u_n = \\sqrt{n}$.\n$f(x) = \\sqrt{x}$ est croissante sur $[0; +\\infty[$. Croissante.",
                        "Exemple complet : $u_{n+1} = \\frac{1}{2}u_n$ avec $u_0 = 10$.\n$u_n$ est géométrique de raison $0,5$. Comme $0 < 0,5 < 1$ et $u_0 > 0$. Décroissante.",
                        "Exemple complet : $u_n = (-1)^n$.\n$u_0 = 1, u_1 = -1, u_2 = 1$. Non monotone.",
                        "Exemple complet : $u_n = \\frac{2^n}{n!}$.\n$\\frac{u_{n+1}}{u_n} = \\frac{2^{n+1}}{(n+1)!} \\times \\frac{n!}{2^n} = \\frac{2}{n+1}$.\nPour $n \\geq 1$, $n+1 \\geq 2$, donc $\\frac{2}{n+1} \\leq 1$. Décroissante."
                    ]
                },
                {
                    "title": "Étape 4 : Déduction de la convergence d'une suite",
                    "content": "Une suite $(u_n)$ converge si elle admet une limite réelle finie $l$ quand $n$ tend vers $+\\infty$.\nThéorèmes fondamentaux :\n1. Toute suite croissante et majorée converge.\n2. Toute suite décroissante et minorée converge.\n3. Si $u_{n+1} = f(u_n)$ et si la suite converge vers $l$, alors $l$ est solution de l'équation $f(l) = l$.\n4. Limites de suites usuelles ($q^n$ avec $|q|<1$).",
                    "example": "Soit la suite $(u_n)$ définie par $u_0 = 0$ et $u_{n+1} = \\sqrt{u_n + 2}$ :\nOn montre par récurrence que $0 \\leq u_n < 2$ (majorée).\nOn montre que $u_{n+1} - u_n > 0$ (croissante).\n\nD'après le théorème de convergence monotone, la suite $(u_n)$ converge vers une limite $l$.\nLa fonction $f(x) = \\sqrt{x+2}$ étant continue, la limite $l$ vérifie :\n$l = \\sqrt{l + 2}$\n$l^2 = l + 2$\n$l^2 - l - 2 = 0$\n$Δ = (-1)^2 - 4(1)(-2) = 9$.\n$l_1 = \\frac{1-3}{2} = -1$ et $l_2 = \\frac{1+3}{2} = 2$.\n\nComme $u_n \\geq 0$, la limite doit être $l = 2$.\nLa suite $(u_n)$ converge vers 2.",
                    "extras": [
                        "Exemple complet : $u_n = (\\frac{1}{3})^n$. Comme $|1/3| < 1$, $\\lim u_n = 0$. Converge.",
                        "Exemple complet : $u_n = \\frac{2n+1}{n+3}$. $\\lim \\frac{2n}{n} = 2$. Converge.",
                        "Exemple complet : $u_n = 2^n$. Comme $2 > 1$, $\\lim u_n = +\\infty$. Diverge.",
                        "Exemple complet : $u_n = \\frac{(-1)^n}{n}$. Par encadrement $|u_n| \\leq \\frac{1}{n}$, $\\lim u_n = 0$. Converge.",
                        "Exemple complet : Suite croissante non majorée. $u_n = n^2$. Diverge vers $+\\infty$.",
                        "Exemple complet : $u_n = 1 - \\frac{1}{n}$. Croissante et majorée par 1. Converge vers 1.",
                        "Exemple complet : $u_{n+1} = \\frac{1}{2}u_n + 3$ avec $u_0 = 1$. Suite arithmético-géométrique. Converge vers $l = \\frac{1}{2}l + 3 \\implies l = 6$.",
                        "Exemple complet : $u_n = \\sin(n)$. N'admet pas de limite. Diverge.",
                        "Exemple complet : $u_n = \\frac{n^2+1}{2n^2-n}$. $\\lim \\frac{n^2}{2n^2} = 0,5$. Converge.",
                        "Exemple complet : $u_n = 0,99^n$. Converge vers 0 car $|0,99| < 1$."
                    ]
                }
            ]




            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
