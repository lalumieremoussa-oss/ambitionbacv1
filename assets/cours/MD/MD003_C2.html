<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Limites – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =


            [
                {
                    "title": "Étape 1 : Dérivées des fonctions élémentaires usuelles ($a, x, ax, x^2, x^n$)",
                    "content": "La dérivation est un outil fondamental pour étudier les variations d'une fonction. \nPour les fonctions de base, on applique les formules directes issues de la définition du nombre dérivé.\n\n**1. Fonction constante :** Si $f(x) = a$ (où $a$ est un réel), alors $f'(x) = 0$.\n**2. Fonction identité :** Si $f(x) = x$, alors $f'(x) = 1$.\n**3. Fonction linéaire :** Si $f(x) = ax$, alors $f'(x) = a$.\n**4. Fonction carré :** Si $f(x) = x^2$, alors $f'(x) = 2x$.\n**5. Fonction puissance :** Si $f(x) = x^n$ (avec $n \\in \\mathbb{Z}^*$), alors $f'(x) = n x^{n-1}$.\n\n**Règle de linéarité :** La dérivée d'une somme est la somme des dérivées : $(u + v)' = u' + v'$.\nLa dérivée d'une fonction multipliée par une constante est : $(k \\cdot u)' = k \\cdot u'$.",
                    "example": "Calculons la dérivée de la fonction polynôme $f(x) = 4x^3 - 5x^2 + 7x - 10$ :\n\n**Analyse terme par terme :**\n- Pour $4x^3$ : la dérivée est $4 \\times (3x^2) = 12x^2$.\n- Pour $-5x^2$ : la dérivée est $-5 \\times (2x) = -10x$.\n- Pour $7x$ : la dérivée est $7 \\times (1) = 7$.\n- Pour $-10$ : la dérivée est $0$.\n\n**Résultat final :**\n$f'(x) = 12x^2 - 10x + 7$.",
                    "extras": [
                        "Exemple complet : Soit $f(x) = x^5 + x^3$. \nIci $n=5$ et $n=3$.\n$f'(x) = 5x^{5-1} + 3x^{3-1}$.\n$f'(x) = 5x^4 + 3x^2$.",
                        "Exemple complet : Soit $f(x) = -2x^4 + 8x$. \nDérivée de $-2x^4$ est $-2(4x^3) = -8x^3$.\nDérivée de $8x$ est $8$.\n$f'(x) = -8x^3 + 8$.",
                        "Exemple complet : Soit $f(x) = \\frac{1}{2}x^2 - \\pi$. \nDérivée de $\\frac{1}{2}x^2$ est $\\frac{1}{2}(2x) = x$.\nDérivée de la constante $-\\pi$ est $0$.\n$f'(x) = x$.",
                        "Exemple complet : Soit $f(x) = x^{-3}$ (pour $x \\neq 0$). \nEn utilisant $n x^{n-1}$ avec $n = -3$ :\n$f'(x) = -3x^{-3-1} = -3x^{-4} = -\\frac{3}{x^4}$.",
                        "Exemple complet : Soit $f(x) = 100x$. \nC'est une fonction de la forme $ax$ avec $a=100$.\n$f'(x) = 100$."
                    ]
                },
                {
                    "title": "Étape 2 : Dérivées des fonctions inverses, irrationnelles et trigonométriques",
                    "content": "Cette étape traite des fonctions non polynomiales dont les dérivées sont indispensables pour l'étude des fonctions plus complexes.\n\n**1. Fonction inverse :** Si $f(x) = \\frac{1}{x}$, alors $f'(x) = -\\frac{1}{x^2}$.\n**2. Fonction racine carrée :** Si $f(x) = \\sqrt{x}$, alors $f'(x) = \\frac{1}{2\\sqrt{x}}$ (pour $x > 0$).\n**3. Fonctions trigonométriques :**\n- Si $f(x) = \\sin(x)$, alors $f'(x) = \\cos(x)$.\n- Si $f(x) = \\cos(x)$, alors $f'(x) = -\\sin(x)$.\n- Si $f(x) = \\tan(x)$, alors $f'(x) = 1 + \\tan^2(x) = \\frac{1}{\\cos^2(x)}$.",
                    "example": "Calculons la dérivée de $f(x) = 3\\sqrt{x} - \\frac{2}{x}$ :\n\n**Décomposition :**\n- Dérivée de $3\\sqrt{x}$ : $3 \\times \\frac{1}{2\\sqrt{x}} = \\frac{3}{2\\sqrt{x}}$.\n- Dérivée de $-\\frac{2}{x}$ : On sait que $(\\frac{1}{x})' = -\\frac{1}{x^2}$.\nDonc $(-2 \\times \\frac{1}{x})' = -2 \\times (-\\frac{1}{x^2}) = \\frac{2}{x^2}$.\n\n**Résultat final :**\n$f'(x) = \\frac{3}{2\\sqrt{x}} + \\frac{2}{x^2}$.",
                    "extras": [
                        "Exemple complet : Soit $f(x) = x + \\cos(x)$. \n$f'(x) = (x)' + (\\cos x)'$.\n$f'(x) = 1 - \\sin(x)$.",
                        "Exemple complet : Soit $f(x) = 2\\sin(x) + 4\\tan(x)$. \n$f'(x) = 2\\cos(x) + 4(1 + \\tan^2 x)$.\n$f'(x) = 2\\cos(x) + 4 + 4\\tan^2(x)$.",
                        "Exemple complet : Soit $f(x) = \\frac{-5}{x} + \\sqrt{x}$. \n$f'(x) = -5(-\\frac{1}{x^2}) + \\frac{1}{2\\sqrt{x}}$.\n$f'(x) = \\frac{5}{x^2} + \\frac{1}{2\\sqrt{x}}$.",
                        "Exemple complet : Soit $f(x) = -\\cos(x) - \\sin(x)$. \n$f'(x) = -(-\\sin x) - (\\cos x)$.\n$f'(x) = \\sin(x) - \\cos(x)$.",
                        "Exemple complet : Soit $f(x) = \\frac{\\sqrt{x}}{4}$. \n$f(x) = \\frac{1}{4} \\times \\sqrt{x}$.\n$f'(x) = \\frac{1}{4} \\times \\frac{1}{2\\sqrt{x}} = \\frac{1}{8\\sqrt{x}}$."
                    ]
                },
                {
                    "title": "Étape 3 : Dérivation des fonctions composées (puissances d'une fonction $u^n$)",
                    "content": "Lorsqu'une fonction est une puissance d'une autre fonction (ex: $(3x+1)^2$), on ne peut pas dériver directement terme à terme sans précaution. On utilise la règle de la chaîne.\n\n**Formule générale :**\nSi $f(x) = (u(x))^n$, alors $f'(x) = n \\cdot u'(x) \\cdot (u(x))^{n-1}$.\n\n**Cas particuliers :**\n- Pour $f(x) = u^2$, alors $f'(x) = 2 u' u$.\n- Pour $f(x) = u^3$, alors $f'(x) = 3 u' u^2$.",
                    "example": "Calculons la dérivée de $f(x) = (2x^2 - 5x + 3)^4$ :\n\n**Identification :**\n$u(x) = 2x^2 - 5x + 3$ et $n = 4$.\nCalcul de $u'(x) = 4x - 5$.\n\n**Application de la formule ($n u' u^{n-1}$) :**\n$f'(x) = 4 \\times (4x - 5) \\times (2x^2 - 5x + 3)^{4-1}$.\n\n**Résultat final :**\n$f'(x) = (16x - 20)(2x^2 - 5x + 3)^3$.",
                    "extras": [
                        "Exemple complet : Soit $f(x) = (5x + 1)^2$. \n$u = 5x+1$ et $u' = 5$.\n$f'(x) = 2 \\times 5 \\times (5x + 1)^1$.\n$f'(x) = 10(5x + 1) = 50x + 10$.",
                        "Exemple complet : Soit $f(x) = (x^2 + x)^3$. \n$u = x^2+x$ et $u' = 2x+1$.\n$f'(x) = 3 \\times (2x+1) \\times (x^2 + x)^2$.\n$f'(x) = (6x + 3)(x^2 + x)^2$.",
                        "Exemple complet : Soit $f(x) = (1 - x)^5$. \n$u = 1-x$ et $u' = -1$.\n$f'(x) = 5 \\times (-1) \\times (1 - x)^4$.\n$f'(x) = -5(1 - x)^4$.",
                        "Exemple complet : Soit $f(x) = (4x^3)^2$. \nIci $u = 4x^3$ et $u' = 12x^2$.\n$f'(x) = 2 \\times 12x^2 \\times (4x^3) = 24x^2 \\times 4x^3 = 96x^5$.\n(Note: on aurait pu simplifier $f(x) = 16x^6$ avant).",
                        "Exemple complet : Soit $f(x) = (x^2 - 9)^{10}$. \n$u = x^2-9$ et $u' = 2x$.\n$f'(x) = 10 \\times 2x \\times (x^2 - 9)^9 = 20x(x^2 - 9)^9$."
                    ]
                },
                {
                    "title": "Étape 4 : Dérivation des fonctions composées inverses ($1/u$, $a/u$, $a/u^n$)",
                    "content": "Cette étape concerne les fonctions où la variable se trouve au dénominateur sous une forme composée.\n\n**1. Formule de l'inverse :**\nSi $f(x) = \\frac{1}{u(x)}$, alors $f'(x) = -\\frac{u'(x)}{(u(x))^2}$.\n\n**2. Cas avec une constante $a$ :**\nSi $f(x) = \\frac{a}{u(x)}$, alors $f'(x) = -\\frac{a \\cdot u'(x)}{u^2}$.\n\n**3. Cas de la puissance au dénominateur :**\nSi $f(x) = \\frac{a}{u^n}$, on peut utiliser la forme $a \\cdot u^{-n}$ ou la formule :\n$f'(x) = -\\frac{a \\cdot n \\cdot u'}{u^{n+1}}$.",
                    "example": "Calculons la dérivée de $f(x) = \\frac{4}{x^2 - 3x + 1}$ :\n\n**Identification :**\n$a = 4$ et $u(x) = x^2 - 3x + 1$.\nCalcul de $u'(x) = 2x - 3$.\n\n**Application de la formule ($-\\frac{a u'}{u^2}$) :**\n$f'(x) = -\\frac{4 \\times (2x - 3)}{(x^2 - 3x + 1)^2}$.\n\n**Résultat final :**\n$f'(x) = \\frac{-8x + 12}{(x^2 - 3x + 1)^2}$.",
                    "extras": [
                        "Exemple complet : Soit $f(x) = \\frac{1}{3x + 2}$. \n$u = 3x+2$ et $u' = 3$.\n$f'(x) = -\\frac{3}{(3x + 2)^2}$.",
                        "Exemple complet : Soit $f(x) = \\frac{-2}{x^2 + 5}$. \n$u = x^2+5$ et $u' = 2x$.\n$f'(x) = -\\frac{-2 \\times 2x}{(x^2 + 5)^2} = \\frac{4x}{(x^2 + 5)^2}$.",
                        "Exemple complet : Soit $f(x) = \\frac{1}{(x+1)^2}$. \nIci $u=x+1, u'=1, n=2$.\nEn utilisant $-\\frac{n u'}{u^{n+1}}$ :\n$f'(x) = -\\frac{2 \\times 1}{(x+1)^3} = -\\frac{2}{(x+1)^3}$.",
                        "Exemple complet : Soit $f(x) = \\frac{3}{\\sin(x)}$. \n$u = \\sin x$ et $u' = \\cos x$.\n$f'(x) = -\\frac{3\\cos(x)}{\\sin^2(x)}$.",
                        "Exemple complet : Soit $f(x) = \\frac{7}{x^4}$. \n$u = x^4$ et $u' = 4x^3$.\n$f'(x) = -\\frac{7 \\times 4x^3}{(x^4)^2} = -\\frac{28x^3}{x^8} = -\\frac{28}{x^5}$."
                    ]
                }
            ]



            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
