<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Limites – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =


            [
                {
                    "title": "Étape 1 : Détermination des racines cubiques d'un nombre complexe",
                    "content": "Pour trouver les racines cubiques d'un nombre complexe $Z$, on utilise sa forme trigonométrique ou exponentielle $Z = R e^{i\theta} = R(\cos \theta + i \sin \theta)$.\nUne racine cubique $z$ est un complexe tel que $z^3 = Z$.\nD'après le cours, si $Z$ a pour module $R$ et pour argument $\theta$, alors les trois racines cubiques $z_k$ ont :\n1. Pour module : $r = \sqrt[3]{R}$\n2. Pour arguments : $\theta_k = \frac{\theta + 2k\pi}{3}$ avec $k \in \{0, 1, 2\}$.\nIl est essentiel de bien convertir le nombre initial en forme trigonométrique avant d'appliquer ces formules.",
                    "example": "Résolvons l'équation $z^3 = i$ :\nIci $Z = i$. Calculons sa forme trigonométrique :\nLe module est $R = |i| = 1$.\nL'argument est $\theta = \frac{\pi}{2}$ car $i = \cos \frac{\pi}{2} + i \sin \frac{\pi}{2}$.\n\nCalculons les racines $z_k$ :\nLe module des racines est $r = \sqrt[3]{1} = 1$.\nLes arguments sont $\theta_k = \frac{\pi/2 + 2k\pi}{3} = \frac{\pi}{6} + \frac{2k\pi}{3}$.\n\nPour $k = 0$ :\n$z_0 = 1(e^{i\frac{\pi}{6}}) = \cos \frac{\pi}{6} + i \sin \frac{\pi}{6} = \frac{\sqrt{3}}{2} + \frac{1}{2}i$.\n\nPour $k = 1$ :\n$z_1 = 1(e^{i(\frac{\pi}{6} + \frac{2\pi}{3})}) = e^{i\frac{5\pi}{6}} = \cos \frac{5\pi}{6} + i \sin \frac{5\pi}{6} = -\frac{\sqrt{3}}{2} + \frac{1}{2}i$.\n\nPour $k = 2$ :\n$z_2 = 1(e^{i(\frac{\pi}{6} + \frac{4\pi}{3})}) = e^{i\frac{9\pi}{6}} = e^{i\frac{3\pi}{2}} = -i$.",
                    "extras": [
                        "Exemple complet : Résolvons $z^3 = -27$.\nLe complexe $Z = -27$ a pour module $27$ et pour argument $\pi$ (car il est sur l'axe réel négatif).\nLes racines ont pour module $r = \sqrt[3]{27} = 3$.\nLes arguments sont $\theta_k = \frac{\pi + 2k\pi}{3}$.\n$z_0 = 3e^{i\frac{\pi}{3}} = 3(\frac{1}{2} + i\frac{\sqrt{3}}{2}) = \frac{3}{2} + i\frac{3\sqrt{3}}{2}$.\n$z_1 = 3e^{i\pi} = -3$.\n$z_2 = 3e^{i\frac{5\pi}{3}} = 3(\frac{1}{2} - i\frac{\sqrt{3}}{2}) = \frac{3}{2} - i\frac{3\sqrt{3}}{2}$.",
                        "Remarque géométrique : Les points images des racines $n$-ièmes d'un nombre complexe forment toujours un polygone régulier à $n$ côtés inscrit dans un cercle de rayon $\sqrt[n]{R}$."
                    ]
                },
                {
                    "title": "Étape 2 : Détermination des racines quatrièmes d'un nombre complexe",
                    "content": "La recherche des racines quatrièmes suit la même logique que pour les racines cubiques, mais avec $n=4$.\nPour un complexe $Z = R(\cos \theta + i \sin \theta)$, les quatre racines $z_k$ (pour $k$ allant de $0$ à $3$) sont données par :\n$z_k = \sqrt[4]{R} \left[ \cos\left(\frac{\theta + 2k\pi}{4}\right) + i \sin\left(\frac{\theta + 2k\pi}{4}\right) \right]$.\nCette méthode est particulièrement utile pour résoudre des équations de la forme $z^4 = a$ ou $z^4 + a = 0$.",
                    "example": "Trouvons les racines quatrièmes de $Z = 8(1 + i\sqrt{3})$ :\nCalculons d'abord la forme trigonométrique de $1 + i\sqrt{3}$ :\nModule : $\sqrt{1^2 + (\sqrt{3})^2} = \sqrt{4} = 2$.\nArgument : $\cos \alpha = 1/2$ et $\sin \alpha = \sqrt{3}/2$, donc $\alpha = \frac{\pi}{3}$.\nAinsi, $Z = 8 \times 2 e^{i\frac{\pi}{3}} = 16 e^{i\frac{\pi}{3}}$.\n\nCalcul des racines $z_k$ :\nLe module est $r = \sqrt[4]{16} = 2$.\nL'argument est $\theta_k = \frac{\pi/3 + 2k\pi}{4} = \frac{\pi}{12} + \frac{2k\pi}{4} = \frac{\pi}{12} + \frac{k\pi}{2}$.\n\nPour $k = 0$ : $z_0 = 2e^{i\frac{\pi}{12}}$.\nPour $k = 1$ : $z_1 = 2e^{i(\frac{\pi}{12} + \frac{\pi}{2})} = 2e^{i\frac{7\pi}{12}}$.\nPour $k = 2$ : $z_2 = 2e^{i(\frac{\pi}{12} + \pi)} = 2e^{i\frac{13\pi}{12}}$.\nPour $k = 3$ : $z_3 = 2e^{i(\frac{\pi}{12} + \frac{3\pi}{2})} = 2e^{i\frac{19\pi}{12}}$.",
                    "extras": [
                        "Exemple complet : Résolvons $z^4 + 16 = 0$.\nCela revient à $z^4 = -16$. Le complexe $-16$ a pour module $16$ et pour argument $\pi$.\nLe module des racines est $\sqrt[4]{16} = 2$.\nLes arguments sont $\theta_k = \frac{\pi + 2k\pi}{4} = \frac{\pi}{4} + \frac{k\pi}{2}$.\n$z_0 = 2e^{i\frac{\pi}{4}} = 2(\frac{\sqrt{2}}{2} + i\frac{\sqrt{2}}{2}) = \sqrt{2} + i\sqrt{2}$.\n$z_1 = 2e^{i\frac{3\pi}{4}} = -\sqrt{2} + i\sqrt{2}$.\n$z_2 = 2e^{i\frac{5\pi}{4}} = -\sqrt{2} - i\sqrt{2}$.\n$z_3 = 2e^{i\frac{7\pi}{4}} = \sqrt{2} - i\sqrt{2}$.",
                        "Conseil méthodologique : Toujours simplifier les arguments obtenus pour qu'ils soient dans l'intervalle $]-\pi ; \pi]$ ou $[0 ; 2\pi[$ selon la demande de l'exercice."
                    ]
                }
            ]



            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
