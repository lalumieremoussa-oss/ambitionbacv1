<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Denombrement – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =

            [
                {
                    "title": "Étape 1 : La Combinaison ou le tirage simultané (L'ordre ne compte pas)",
                    "content": "Imagine que tu as un sac rempli de boules ou un groupe d'amis. Tu plonges ta main et tu attrapes plusieurs éléments **en une seule fois**. \nDans ce cas, l'ordre dans lequel tu as attrapé les objets n'a aucune importance : que tu sortes 'A puis B' ou 'B puis A', tu as exactement le même groupe dans la main.\n\n**Ce qu'il faut retenir :**\n1. On utilise les **Combinaisons** (notées $C_n^p$).\n2. C'est le cas pour former des commissions, des équipes, des bureaux sans rôles précis, ou faire des tirages simultanés.\n3. La répétition est impossible (on ne peut pas choisir deux fois la même personne dans une équipe).\n\n**La formule magique :**\n$C_n^p = \\frac{n!}{p!(n-p)!}$\n\n*Astuce simple :* Pour choisir 2 personnes parmi 5, on fait $\\frac{5 \\times 4}{2 \\times 1}$.",
                    "example": "**Situation : Création d'une équipe de football de quartier**\nOn a 10 jeunes du quartier qui veulent jouer, mais on ne doit en choisir que 3 pour aller s'inscrire au tournoi.\n\n**Analyse :**\nL'ordre n'est pas important (être choisi le premier ou le troisième ne change rien, on est dans l'équipe).\nOn utilise donc la combinaison de 3 parmi 10.\n\n**Calcul détaillé :**\n$C_{10}^3 = \\frac{10 \\times 9 \\times 8}{3 \\times 2 \\times 1}$\n$C_{10}^3 = \\frac{720}{6} = 120$.\n\n**Résultat :** Il y a 120 façons différentes de former cette petite équipe.",
                    "extras": [
                        "Exemple complet : Dans une classe de 20 élèves, on veut choisir 2 délégués qui ont exactement les mêmes droits.\nIci, l'ordre ne compte pas.\nCalcul : $C_{20}^2 = \\frac{20 \\times 19}{2 \\times 1} = 190$.\nIl y a 190 binômes de délégués possibles.",
                        "Exemple complet : Une urne contient 5 boules rouges et 3 boules vertes. On tire 2 boules simultanément.\nNombre de tirages possibles : $C_8^2 = \\frac{8 \\times 7}{2 \\times 1} = 28$.\nSi on veut 2 boules rouges : $C_5^2 = \\frac{5 \\times 4}{2 \\times 1} = 10$.",
                        "Exemple complet : On veut choisir un groupe de 4 fruits dans un panier qui en contient 6 différents.\nCalcul : $C_6^4 = C_6^2$ (par symétrie).\n$C_6^2 = \\frac{6 \\times 5}{2 \\times 1} = 15$.\nIl y a 15 salades de fruits différentes possibles.",
                        "Exemple complet : Pour un jeu, on doit cocher 5 numéros sur une grille de 49.\nL'ordre de cochage n'importe pas.\nC'est une combinaison $C_{49}^5 = 1 906 884$ possibilités."
                    ]
                },
                {
                    "title": "Étape 2 : L'Arrangement ou le tirage successif sans remise (L'ordre compte)",
                    "content": "Ici, on ne prend pas tout en une seule fois. On choisit les éléments **un par un**. \nL'ordre devient crucial car la première place n'est pas la même que la deuxième (comme dans une course ou pour des postes de chef).\n\n**Ce qu'il faut retenir :**\n1. On utilise les **Arrangements** (notés $A_n^p$).\n2. C'est le cas pour les podiums (1er, 2e, 3e), les bureaux avec des titres (Président, Secrétaire), ou les mots de passe avec des chiffres différents.\n3. La répétition est toujours impossible (un coureur ne peut pas être 1er et 2e en même temps).\n\n**La formule magique :**\n$A_n^p = n \\times (n-1) \\times \\dots$ (on descend $p$ fois).\n\n*Cas particulier :* Si on range **tous** les objets ($p=n$), on appelle ça une **Permutation** ($n!$).",
                    "example": "**Situation : Élection du bureau de la classe**\nDans une classe de 15 élèves, on veut élire un Président et un Trésorier (deux rôles différents).\n\n**Analyse :**\nL'ordre est important : Si Paul est Président et Marie Trésorière, c'est différent de Marie Présidente et Paul Trésorier.\nOn choisit 2 personnes parmi 15 dans un ordre précis.\n\n**Calcul détaillé :**\nPour le poste de Président, on a 15 choix possibles.\nUne fois le Président élu, il ne reste que 14 choix pour le Trésorier.\nTotal = $15 \\times 14 = 210$.\n\n**Résultat :** Il y a 210 bureaux possibles.",
                    "extras": [
                        "Exemple complet : Une course de 8 chevaux. On veut trouver le 'Tiercé' dans l'ordre.\nC'est un arrangement de 3 parmi 8.\nCalcul : $A_8^3 = 8 \\times 7 \\times 6 = 336$.\nIl y a 336 arrivées possibles.",
                        "Exemple complet : On veut créer un code de 4 chiffres tous différents en utilisant les chiffres de 1 à 9.\nCalcul : $A_9^4 = 9 \\times 8 \\times 7 \\times 6 = 3 024$ codes.",
                        "Exemple complet : Combien de mots de 3 lettres (ayant un sens ou non) peut-on former avec les lettres du mot 'MATHS' (5 lettres) sans répéter de lettre ?\nCalcul : $A_5^3 = 5 \\times 4 \\times 3 = 60$ mots.",
                        "Exemple complet : 5 amis s'assoient sur un banc de 5 places. De combien de façons peuvent-ils se placer ?\nC'est une permutation des 5 amis.\nCalcul : $5! = 5 \\times 4 \\times 3 \\times 2 \\times 1 = 120$ façons."
                    ]
                },
                {
                    "title": "Étape 3 : La p-liste ou le tirage successif avec remise (Ordre et Répétition)",
                    "content": "C'est le cas le plus libre. On choisit les éléments **un par un**, mais après chaque choix, on remet l'élément à sa place (ou on s'autorise à le choisir encore).\n\n**Ce qu'il faut retenir :**\n1. On utilise la puissance : $n^p$.\n2. L'ordre compte énormément.\n3. La répétition est autorisée (on peut faire 007 ou AAA).\n4. C'est le cas pour les codes de carte bleue, les numéros de téléphone ou les lancers de dés successifs.\n\n**La formule magique :**\n$N = n^p$ (Nombre de choix au total puissance nombre de fois où on choisit).",
                    "example": "**Situation : Création d'un code de valise**\nUne valise possède un code à 3 molettes. Chaque molette contient les chiffres de 0 à 9 (soit 10 chiffres).\n\n**Analyse :**\nL'ordre compte (le code 1-2-3 n'ouvre pas si le bon est 3-2-1).\nOn peut répéter les chiffres (le code 5-5-5 est possible).\n\n**Calcul détaillé :**\n1ère molette : 10 choix.\n2ème molette : 10 choix.\n3ème molette : 10 choix.\nTotal = $10 \\times 10 \\times 10 = 10^3 = 1000$.\n\n**Résultat :** Il y a 1000 codes possibles (de 000 à 999).",
                    "extras": [
                        "Exemple complet : On lance une pièce de monnaie (Pile ou Face) 5 fois de suite.\nChaque lancer a 2 possibilités.\nCalcul : $2^5 = 2 \\times 2 \\times 2 \\times 2 \\times 2 = 32$ résultats possibles.",
                        "Exemple complet : Un QCM comporte 10 questions. Pour chaque question, il y a 3 réponses possibles (A, B ou C).\nCalcul : $3^{10} = 59 049$ façons de répondre au questionnaire.",
                        "Exemple complet : Combien de numéros de téléphone de 2 chiffres peut-on former avec les chiffres de 0 à 9 ?\nCalcul : $10^2 = 100$ numéros (de 00 à 99).",
                        "Exemple complet : On tire 3 boules l'une après l'autre avec remise dans une urne qui en contient 7.\nCalcul : $7^3 = 7 \\times 7 \\times 7 = 343$ tirages possibles."
                    ]
                }
            ]




            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
