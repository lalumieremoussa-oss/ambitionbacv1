<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2> – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =


            [
                {
                    "title": "Étape 1 : Dérivées de base et Formes linéaires $(e^x)$ et $(e^{ax+b})$",
                    "content": "La fonction exponentielle, notée $exp$ ou $e^x$, possède la propriété unique d'être égale à sa propre dérivée sur $\\mathbb{R}$. \nPour toute fonction de la forme $f(x) = e^{u(x)}$, la dérivée est donnée par le produit de la dérivée de l'exposant par l'expression originale : $(e^u)' = u' \\cdot e^u$.\nDans le cas simple d'une fonction affine en exposant $u(x) = ax + b$, la dérivée devient simplement $a \\cdot e^{ax+b}$.\nCes règles constituent le socle fondamental pour aborder l'étude des variations de fonctions exponentielles.",
                    "example": "Soit la fonction $f$ définie sur $\\mathbb{R}$ par $f(x) = e^{5x - 3}$.\nIdentifions l'exposant : $u(x) = 5x - 3$.\nCalculons la dérivée de l'exposant : $u'(x) = 5$.\nAppliquons la formule $f'(x) = u'(x) \\cdot e^{u(x)}$.\nOn obtient : $f'(x) = 5 \\cdot e^{5x - 3}$.\nConclusion : La dérivée est $f'(x) = 5e^{5x - 3}$.",
                    "extras": [
                        "Exemple complet : Soit $f(x) = 4e^x$. \nComme la dérivée de $e^x$ est $e^x$, on applique la règle de multiplication par une constante.\n$f'(x) = 4 \\cdot (e^x)' = 4e^x$.",
                        "Exemple complet : Soit $f(x) = e^{-x}$. \nIci $u(x) = -x$, donc $u'(x) = -1$.\n$f'(x) = -1 \\cdot e^{-x} = -e^{-x}$.",
                        "Exemple complet : Soit $f(x) = 3e^{2x} + 1$. \nLa dérivée de $1$ est $0$. Pour $3e^{2x}$, $u(x)=2x$ donc $u'(x)=2$.\n$f'(x) = 3 \\cdot (2e^{2x}) = 6e^{2x}$.",
                        "Exemple complet : Soit $f(x) = e^{-3x+4}$. \nL'exposant est $-3x+4$ de dérivée $-3$.\n$f'(x) = -3e^{-3x+4}$.",
                        "Exemple complet : Soit $f(x) = \frac{1}{2}e^{4x}$. \nLa dérivée de l'exposant est $4$.\n$f'(x) = \frac{1}{2} \\cdot 4e^{4x} = 2e^{4x}$.",
                        "Exemple complet : Soit $f(x) = e^{x} - 4x + 2$. \nOn dérive terme à terme : $(e^x)' = e^x$, $(-4x)' = -4$ et $(2)' = 0$.\n$f'(x) = e^x - 4$.",
                        "Exemple complet : Soit $f(x) = e^{0,5x}$. \nLa dérivée de $0,5x$ est $0,5$.\n$f'(x) = 0,5e^{0,5x}$.",
                        "Exemple complet : Soit $f(x) = 10 - e^{x}$. \nLa dérivée de $10$ est $0$ et celle de $-e^x$ est $-e^x$.\n$f'(x) = -e^x$.",
                        "Exemple complet : Soit $f(x) = e^{x+100}$. \nL'exposant $x+100$ a pour dérivée $1$.\n$f'(x) = 1 \\cdot e^{x+100} = e^{x+100}$.",
                        "Exemple complet : Soit $f(x) = -2e^{-5x}$. \n$u'(x) = -5$.\n$f'(x) = -2 \\cdot (-5e^{-5x}) = 10e^{-5x}$."
                    ]
                },
                {
                    "title": "Étape 2 : Dérivation de produits et de quotients $(u \\cdot v)$ et $(u/v)$",
                    "content": "L'utilisation de l'exponentielle dans des produits ou des quotients est extrêmement fréquente en analyse. \nOn utilise les formules classiques de dérivation :\n- Produit : $(u \\cdot v)' = u'v + uv'$\n- Quotient : $(\\frac{u}{v})' = \\frac{u'v - uv'}{v^2}$\nUne particularité de l'exponentielle dans ces calculs est qu'elle peut presque toujours être mise en facteur dans l'expression finale de la dérivée, ce qui facilite grandement l'étude du signe de $f'(x)$.",
                    "example": "Soit la fonction $g$ définie sur $\\mathbb{R}$ par $g(x) = x \\cdot e^x$.\nReconnaissons la forme $u \\cdot v$ avec :\n$u(x) = x \\implies u'(x) = 1$\n$v(x) = e^x \\implies v'(x) = e^x$\nAppliquons la formule $(u'v + uv')$ :\n$g'(x) = 1 \\cdot e^x + x \\cdot e^x$\nFactorisons par $e^x$ :\n$g'(x) = e^x(1 + x)$\nConclusion : $g'(x) = (x + 1)e^x$.",
                    "extras": [
                        "Exemple complet : Soit $f(x) = x^2 e^x$. \n$u=x^2, u'=2x$ et $v=e^x, v'=e^x$.\n$f'(x) = 2x e^x + x^2 e^x = x(2+x)e^x$.",
                        "Exemple complet : Soit $f(x) = \frac{e^x}{x}$. \n$u=e^x, u'=e^x$ et $v=x, v'=1$.\n$f'(x) = \frac{e^x \\cdot x - e^x \\cdot 1}{x^2} = \frac{(x-1)e^x}{x^2}$.",
                        "Exemple complet : Soit $f(x) = (x+1)e^x$. \n$u=x+1, u'=1$ et $v=e^x, v'=e^x$.\n$f'(x) = 1 \\cdot e^x + (x+1)e^x = (x+2)e^x$.",
                        "Exemple complet : Soit $f(x) = \frac{1}{e^x}$. \nOn peut utiliser $1/v$ ou écrire $e^{-x}$.\n$f'(x) = \frac{0 \\cdot e^x - 1 \\cdot e^x}{(e^x)^2} = \frac{-e^x}{e^{2x}} = -e^{-x}$.",
                        "Exemple complet : Soit $f(x) = x e^{-x}$. \n$u=x, u'=1$ et $v=e^{-x}, v'=-e^{-x}$.\n$f'(x) = 1 \\cdot e^{-x} + x(-e^{-x}) = (1-x)e^{-x}$.",
                        "Exemple complet : Soit $f(x) = (2x-3)e^x$. \n$u=2x-3, u'=2$.\n$f'(x) = 2e^x + (2x-3)e^x = (2x-1)e^x$.",
                        "Exemple complet : Soit $f(x) = \frac{e^x+1}{e^x}$. \n$f'(x) = \frac{e^x(e^x) - (e^x+1)e^x}{(e^x)^2} = \frac{e^{2x} - e^{2x} - e^x}{e^{2x}} = -\frac{e^x}{e^{2x}} = -e^{-x}$.",
                        "Exemple complet : Soit $f(x) = (x^2-2x+2)e^x$. \n$u'=2x-2$.\n$f'(x) = (2x-2)e^x + (x^2-2x+2)e^x = x^2e^x$.",
                        "Exemple complet : Soit $f(x) = \frac{x+1}{e^x}$. \n$f'(x) = \frac{1 \\cdot e^x - (x+1)e^x}{(e^x)^2} = \frac{e^x(1-x-1)}{e^{2x}} = \frac{-x}{e^x}$.",
                        "Exemple complet : Soit $f(x) = (3-x)e^{2x}$. \n$u=3-x, u'=-1$ et $v=e^{2x}, v'=2e^{2x}$.\n$f'(x) = -1e^{2x} + (3-x)(2e^{2x}) = e^{2x}(-1+6-2x) = (5-2x)e^{2x}$."
                    ]
                },
                {
                    "title": "Étape 3 : Compositions complexes et Fonctions de type $e^{u(x)}$",
                    "content": "Lorsque l'exposant n'est plus une simple fonction affine mais une fonction polynôme, rationnelle ou comportant une racine carrée, la rigueur dans le calcul de $u'(x)$ est primordiale.\nLa formule reste $f'(x) = u'(x) \\cdot e^{u(x)}$. \nIl est conseillé de toujours calculer $u'(x)$ séparément sur son brouillon avant de l'intégrer dans la formule finale. \nAttention aux domaines de dérivabilité, notamment pour les racines carrées au dénominateur.",
                    "example": "Soit la fonction $h$ définie sur $]0 ; +\\infty[$ par $h(x) = e^{\\sqrt{x}}$.\nPosons $u(x) = \\sqrt{x}$.\nLa dérivée de la racine carrée est $u'(x) = \\frac{1}{2\\sqrt{x}}$.\nAppliquons la règle de composition :\n$h'(x) = \\frac{1}{2\\sqrt{x}} \\cdot e^{\\sqrt{x}}$.\nOn peut réorganiser l'écriture :\n$h'(x) = \\frac{e^{\\sqrt{x}}}{2\\sqrt{x}}$.\nConclusion : $h'(x) = \\frac{e^{\\sqrt{x}}}{2\\sqrt{x}}$.",
                    "extras": [
                        "Exemple complet : Soit $f(x) = e^{x^2 - 3x}$. \n$u(x) = x^2-3x \\implies u'(x) = 2x-3$.\n$f'(x) = (2x-3)e^{x^2-3x}$.",
                        "Exemple complet : Soit $f(x) = e^{1/x}$. \n$u(x) = 1/x \\implies u'(x) = -1/x^2$.\n$f'(x) = -\\frac{e^{1/x}}{x^2}$.",
                        "Exemple complet : Soit $f(x) = e^{x^3}$. \n$u'(x) = 3x^2$.\n$f'(x) = 3x^2 e^{x^3}$.",
                        "Exemple complet : Soit $f(x) = e^{\\cos(x)}$. \n$u(x) = \\cos(x) \\implies u'(x) = -\\sin(x)$.\n$f'(x) = -\\sin(x)e^{\\cos(x)}$.",
                        "Exemple complet : Soit $f(x) = e^{\\frac{x+1}{x-1}}$. \n$u'(x) = \\frac{1(x-1)-1(x+1)}{(x-1)^2} = \\frac{-2}{(x-1)^2}$.\n$f'(x) = \\frac{-2e^{\\frac{x+1}{x-1}}}{(x-1)^2}$.",
                        "Exemple complet : Soit $f(x) = e^{x^2+x+1}$. \n$u'(x) = 2x+1$.\n$f'(x) = (2x+1)e^{x^2+x+1}$.",
                        "Exemple complet : Soit $f(x) = (e^x)^2$. \nOn écrit $e^{2x}$. $u(x)=2x \\implies u'=2$.\n$f'(x) = 2e^{2x}$.",
                        "Exemple complet : Soit $f(x) = e^{-x^2}$. \n$u'(x) = -2x$.\n$f'(x) = -2x e^{-x^2}$.",
                        "Exemple complet : Soit $f(x) = e^{\\sqrt{2x+1}}$. \n$u'(x) = \\frac{2}{2\\sqrt{2x+1}} = \\frac{1}{\\sqrt{2x+1}}$.\n$f'(x) = \\frac{e^{\\sqrt{2x+1}}}{\\sqrt{2x+1}}$.",
                        "Exemple complet : Soit $f(x) = e^{1-x^2}$. \n$u'(x) = -2x$.\n$f'(x) = -2xe^{1-x^2}$."
                    ]
                },
                {
                    "title": "Étape 4 : Applications avancées, Quotients complexes et Synthèse",
                    "content": "Cette dernière étape se concentre sur les fonctions rencontrées dans les problèmes de synthèse du Baccalauréat. \nCes fonctions mélangent souvent plusieurs types d'opérations (somme de produits, quotients avec exponentielles au numérateur et au dénominateur).\nLa clé du succès réside dans la simplification rigoureuse des expressions après dérivation. \nIl est impératif de factoriser par l'exponentielle dès que possible pour préparer l'étude du signe de la dérivée, car $e^{u(x)}$ est toujours strictement positif.",
                    "example": "Soit la fonction $k$ définie sur $\\mathbb{R}$ par $k(x) = \\frac{e^x - 1}{e^x + 1}$.\nUtilisons la forme $u/v$ :\n$u(x) = e^x - 1 \\implies u'(x) = e^x$\n$v(x) = e^x + 1 \\implies v'(x) = e^x$\nCalculons $k'(x) = \\frac{u'v - uv'}{v^2}$ :\n$k'(x) = \\frac{e^x(e^x + 1) - (e^x - 1)e^x}{(e^x + 1)^2}$\nDéveloppons le numérateur :\n$k'(x) = \\frac{e^{2x} + e^x - (e^{2x} - e^x)}{(e^x + 1)^2} = \\frac{e^{2x} + e^x - e^{2x} + e^x}{(e^x + 1)^2}$\nSimplifions :\n$k'(x) = \\frac{2e^x}{(e^x + 1)^2}$.\nConclusion : Comme $2e^x > 0$ et le carré est positif, $k$ est strictement croissante.",
                    "extras": [
                        "Exemple complet : Soit $f(x) = (2x-3)e^{2x}$. \n$u=2x-3, u'=2$ et $v=e^{2x}, v'=2e^{2x}$.\n$f'(x) = 2e^{2x} + (2x-3)2e^{2x} = e^{2x}(2+4x-6) = (4x-4)e^{2x}$.",
                        "Exemple complet : Soit $f(x) = \\frac{e^{2x}}{x+1}$. \n$f'(x) = \\frac{2e^{2x}(x+1) - e^{2x}(1)}{(x+1)^2} = \\frac{e^{2x}(2x+2-1)}{(x+1)^2} = \\frac{(2x+1)e^{2x}}{(x+1)^2}$.",
                        "Exemple complet : Soit $f(x) = \\sqrt{e^x}$. \nOn peut écrire $f(x) = (e^x)^{1/2} = e^{0,5x}$.\n$f'(x) = 0,5e^{0,5x} = \\frac{1}{2}\\sqrt{e^x}$.",
                        "Exemple complet : Soit $f(x) = \\frac{3e^x}{e^x+2}$. \n$f'(x) = \\frac{3e^x(e^x+2) - 3e^x(e^x)}{(e^x+2)^2} = \\frac{3e^{2x}+6e^x-3e^{2x}}{(e^x+2)^2} = \\frac{6e^x}{(e^x+2)^2}$.",
                        "Exemple complet : Soit $f(x) = e^x \\cdot \\sin(x)$. \n$f'(x) = e^x \\sin(x) + e^x \\cos(x) = e^x(\\sin x + \\cos x)$.",
                        "Exemple complet : Soit $f(x) = \\frac{1}{e^x-1}$. \n$f'(x) = \\frac{0(e^x-1) - 1(e^x)}{(e^x-1)^2} = \\frac{-e^x}{(e^x-1)^2}$.",
                        "Exemple complet : Soit $f(x) = x^2 e^{-x+1}$. \n$u=x^2, u'=2x$ et $v=e^{-x+1}, v'=-e^{-x+1}$.\n$f'(x) = 2x e^{-x+1} - x^2 e^{-x+1} = x(2-x)e^{-x+1}$.",
                        "Exemple complet : Soit $f(x) = \\frac{x^2}{e^x}$. \n$f'(x) = \\frac{2x e^x - x^2 e^x}{e^{2x}} = \\frac{e^x(2x-x^2)}{e^{2x}} = \\frac{x(2-x)}{e^x}$.",
                        "Exemple complet : Soit $f(x) = (x-1)^2 e^x$. \n$u'=2(x-1)$.\n$f'(x) = 2(x-1)e^x + (x-1)^2 e^x = (x-1)e^x(2+x-1) = (x-1)(x+1)e^x$.",
                        "Exemple complet : Soit $f(x) = \\frac{e^x-e^{-x}}{2}$. \n$f'(x) = \\frac{e^x - (-e^{-x})}{2} = \\frac{e^x+e^{-x}}{2}$."
                    ]
                }
            ]



            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
