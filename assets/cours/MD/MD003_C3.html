<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Limites – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =



            [
                {
                    "title": "Étape 5 : Dérivation des fonctions rationnelles (Quotient $f/g$)",
                    "content": "La dérivation d'un quotient de deux fonctions $u$ et $v$ suit une règle stricte pour éviter les erreurs fréquentes de dérivation séparée.\n\n**Formule du quotient :**\nSi $f(x) = \\frac{u(x)}{v(x)}$, alors $f'(x) = \\frac{u'(x)v(x) - u(x)v'(x)}{(v(x))^2}$.\n\n**Attention :** Il ne faut jamais dériver le numérateur et le dénominateur séparément sans utiliser cette formule. L'ordre au numérateur ($u'v - uv'$) est crucial à cause du signe moins.",
                    "example": "Calculons la dérivée de $f(x) = \\frac{3x - 1}{x^2 + 4}$ :\n\n**Identification :**\n- $u(x) = 3x - 1 \\implies u'(x) = 3$.\n- $v(x) = x^2 + 4 \\implies v'(x) = 2x$.\n\n**Application de la formule :**\n$f'(x) = \\frac{3(x^2 + 4) - (3x - 1)(2x)}{(x^2 + 4)^2}$.\n\n**Développement et réduction du numérateur :**\n$f'(x) = \\frac{3x^2 + 12 - (6x^2 - 2x)}{(x^2 + 4)^2} = \\frac{3x^2 + 12 - 6x^2 + 2x}{(x^2 + 4)^2}$.\n\n**Résultat final :**\n$f'(x) = \\frac{-3x^2 + 2x + 12}{(x^2 + 4)^2}$.",
                    "extras": [
                        "Exemple complet : Soit $f(x) = \\frac{x+1}{x-1}$. \n$u=x+1, u'=1$ / $v=x-1, v'=1$.\n$f'(x) = \\frac{1(x-1) - (x+1)(1)}{(x-1)^2} = \\frac{x-1-x-1}{(x-1)^2} = -\\frac{2}{(x-1)^2}$.",
                        "Exemple complet : Soit $f(x) = \\frac{x^2}{2x+3}$. \n$u=x^2, u'=2x$ / $v=2x+3, v'=2$.\n$f'(x) = \\frac{2x(2x+3) - x^2(2)}{(2x+3)^2} = \\frac{4x^2 + 6x - 2x^2}{(2x+3)^2} = \\frac{2x^2 + 6x}{(2x+3)^2}$.",
                        "Exemple complet : Soit $f(x) = \\frac{2x^2-1}{x^2+1}$. \n$u=2x^2-1, u'=4x$ / $v=x^2+1, v'=2x$.\n$f'(x) = \\frac{4x(x^2+1) - (2x^2-1)(2x)}{(x^2+1)^2} = \\frac{4x^3+4x-4x^3+2x}{(x^2+1)^2} = \\frac{6x}{(x^2+1)^2}$.",
                        "Exemple complet : Soit $f(x) = \\frac{\\cos x}{x}$. \n$u=\\cos x, u'=-\\sin x$ / $v=x, v'=1$.\n$f'(x) = \\frac{-\\sin(x) \\cdot x - \\cos(x) \\cdot 1}{x^2} = -\\frac{x\\sin x + \\cos x}{x^2}$.",
                        "Exemple complet : Soit $f(x) = \\frac{1-3x}{x^3}$. \n$u=1-3x, u'=-3$ / $v=x^3, v'=3x^2$.\n$f'(x) = \\frac{-3(x^3) - (1-3x)(3x^2)}{(x^3)^2} = \\frac{-3x^3 - 3x^2 + 9x^3}{x^6} = \\frac{6x^3 - 3x^2}{x^6} = \\frac{6x-3}{x^4}$."
                    ]
                },
                {
                    "title": "Étape Spéciale : Dérivation d'un produit de fonctions ($u \\times v$)",
                    "content": "La dérivation d'un produit ne correspond pas au produit des dérivées. Si une fonction $f$ est le produit de deux fonctions dérivables $u$ et $v$, alors $f$ est dérivable et sa structure suit une règle d'addition croisée.\n\n**Formule du produit :**\nSi $f(x) = u(x) \\cdot v(x)$, alors sa dérivée est :\n$f'(x) = u'(x)v(x) + u(x)v'(x)$\n\nEn d'autres termes, on dérive la première fonction que l'on multiplie par la seconde intacte, puis on ajoute la première fonction intacte multipliée par la dérivée de la seconde.\nCette règle est indispensable dès que la variable $x$ apparaît multipliée par elle-même sous différentes formes (ex: un polynôme multiplié par une racine ou une fonction trigonométrique).",
                    "example": "Calculons la dérivée de la fonction $f(x) = (3x^2 - 5)(2x + 7)$ :\n\n**1. Identification des fonctions :**\n$u(x) = 3x^2 - 5$\n$v(x) = 2x + 7$\n\n**2. Calcul des dérivées individuelles :**\n$u'(x) = 6x$\n$v'(x) = 2$\n\n**3. Application de la formule $u'v + uv'$ :**\n$f'(x) = (6x)(2x + 7) + (3x^2 - 5)(2)$\n\n**4. Développement et réduction :**\n$f'(x) = 12x^2 + 42x + 6x^2 - 10$\n$f'(x) = 18x^2 + 42x - 10$\n\nL'ensemble dérivé est donc $f'(x) = 18x^2 + 42x - 10$.",
                    "extras": [
                        "Exemple complet : Soit $f(x) = x^2 \\cos(x)$.\n$u = x^2 \\implies u' = 2x$.\n$v = \\cos(x) \\implies v' = -\\sin(x)$.\n$f'(x) = 2x\\cos(x) + x^2(-\\sin(x)) = 2x\\cos(x) - x^2\\sin(x)$.",
                        "Exemple complet : Soit $f(x) = (x+1)\\sqrt{x}$.\n$u = x+1 \\implies u' = 1$.\n$v = \\sqrt{x} \\implies v' = \\frac{1}{2\\sqrt{x}}$.\n$f'(x) = 1 \\cdot \\sqrt{x} + (x+1) \\cdot \\frac{1}{2\\sqrt{x}} = \\sqrt{x} + \\frac{x+1}{2\\sqrt{x}}$.\nEn mettant au même dénominateur : $f'(x) = \\frac{2x + x + 1}{2\\sqrt{x}} = \\frac{3x+1}{2\\sqrt{x}}$.",
                        "Exemple complet : Soit $f(x) = x \\sin(x)$.\n$u = x \\implies u' = 1$.\n$v = \\sin(x) \\implies v' = \\cos(x)$.\n$f'(x) = 1 \\cdot \\sin(x) + x \\cdot \\cos(x) = \\sin(x) + x\\cos(x)$.",
                        "Exemple complet : Soit $f(x) = (x^2 + 1)(x^3 - 2)$.\n$u' = 2x$ et $v' = 3x^2$.\n$f'(x) = 2x(x^3 - 2) + (x^2 + 1)(3x^2) = 2x^4 - 4x + 3x^4 + 3x^2 = 5x^4 + 3x^2 - 4x$.",
                        "Exemple complet : Soit $f(x) = 5x^3 \\sqrt{x}$.\n$u = 5x^3 \\implies u' = 15x^2$.\n$v = \\sqrt{x} \\implies v' = \\frac{1}{2\\sqrt{x}}$.\n$f'(x) = 15x^2\\sqrt{x} + \\frac{5x^3}{2\\sqrt{x}} = \\frac{30x^2(x) + 5x^3}{2\\sqrt{x}} = \\frac{35x^3}{2\\sqrt{x}}$."
                    ]
                },
                {
                    "title": "Étape 6 : Synthèse de dérivation avec radicaux ($x\\sqrt{f}$ et $f\\sqrt{g}$)",
                    "content": "Cette étape combine la règle du produit $(uv)' = u'v + uv'$ et la règle de dérivation des racines carrées composées $(\\sqrt{u})' = \\frac{u'}{2\\sqrt{u}}$.\n\n**Règles à appliquer :**\n- Produit : $f(x) = u(x) \\cdot v(x) \\implies f'(x) = u'(x)v(x) + u(x)v'(x)$.\n- Racine composée : $f(x) = \\sqrt{u(x)} \\implies f'(x) = \\frac{u'(x)}{2\\sqrt{u(x)}}$.",
                    "example": "Calculons la dérivée de $f(x) = x\\sqrt{2x + 4}$ :\n\n**Identification (forme $u \\cdot v$) :**\n- $u(x) = x \\implies u'(x) = 1$.\n- $v(x) = \\sqrt{2x + 4} \\implies v'(x) = \\frac{2}{2\\sqrt{2x + 4}} = \\frac{1}{\\sqrt{2x + 4}}$.\n\n**Application du produit ($u'v + uv'$) :**\n$f'(x) = 1 \\cdot \\sqrt{2x + 4} + x \\cdot \\frac{1}{\\sqrt{2x + 4}}$.\n\n**Mise au même dénominateur :**\n$f'(x) = \\frac{(\\sqrt{2x + 4})^2 + x}{\\sqrt{2x + 4}} = \\frac{2x + 4 + x}{\\sqrt{2x + 4}}$.\n\n**Résultat final :**\n$f'(x) = \\frac{3x + 4}{\\sqrt{2x + 4}}$.",
                    "extras": [
                        "Exemple complet : Soit $f(x) = (x-1)\\sqrt{x}$. \n$u=x-1, u'=1$ / $v=\\sqrt{x}, v'=\\frac{1}{2\\sqrt{x}}$.\n$f'(x) = \\sqrt{x} + \\frac{x-1}{2\\sqrt{x}} = \\frac{2x + x - 1}{2\\sqrt{x}} = \\frac{3x-1}{2\\sqrt{x}}$.",
                        "Exemple complet : Soit $f(x) = x^2\\sqrt{x+1}$. \n$u=x^2, u'=2x$ / $v=\\sqrt{x+1}, v'=\\frac{1}{2\\sqrt{x+1}}$.\n$f'(x) = 2x\\sqrt{x+1} + \\frac{x^2}{2\\sqrt{x+1}} = \\frac{2x(2(x+1)) + x^2}{2\\sqrt{x+1}} = \\frac{5x^2+4x}{2\\sqrt{x+1}}$.",
                        "Exemple complet : Soit $f(x) = \\sqrt{x^2+1}$. \nIci $u = x^2+1, u'=2x$.\n$f'(x) = \\frac{2x}{2\\sqrt{x^2+1}} = \\frac{x}{\\sqrt{x^2+1}}$.",
                        "Exemple complet : Soit $f(x) = (3x)\\sqrt{x^2-5}$. \n$u=3x, u'=3$ / $v=\\sqrt{x^2-5}, v'=\\frac{2x}{2\\sqrt{x^2-5}} = \\frac{x}{\\sqrt{x^2-5}}$.\n$f'(x) = 3\\sqrt{x^2-5} + \\frac{3x^2}{\\sqrt{x^2-5}} = \\frac{3(x^2-5)+3x^2}{\\sqrt{x^2-5}} = \\frac{6x^2-15}{\\sqrt{x^2-5}}$.",
                        "Exemple complet : Soit $f(x) = x^3\\sqrt{x}$. \n$f'(x) = 3x^2\\sqrt{x} + x^3(\\frac{1}{2\\sqrt{x}}) = \\frac{6x^2(x) + x^3}{2\\sqrt{x}} = \\frac{7x^3}{2\\sqrt{x}} = 3,5x^{2,5}$."
                    ]
                },
                {
                    "title": "Étape 7 : Dérivées complexes ($\\sqrt{f/g}$, $\\sqrt{f}/g$, $x\\sqrt{f}/g$)",
                    "content": "Cette étape traite des formes les plus abouties rencontrées en terminale, nécessitant une grande rigueur dans l'enchaînement des formules de dérivation.\n\n**Rappel des priorités :**\n1. Analyser la structure globale (est-ce un quotient ? une racine ?).\n2. Appliquer la formule principale.\n3. Dériver les sous-fonctions au fur et à mesure.\n\n**Formule $\\sqrt{u}$ :** $(\\sqrt{u})' = \\frac{u'}{2\\sqrt{u}}$.\n**Formule $u/v$ :** $(\\frac{u}{v})' = \\frac{u'v - uv'}{v^2}$.",
                    "example": "Calculons la dérivée de $f(x) = \\sqrt{\\frac{x+1}{x-1}}$ :\n\n**Analyse :** C'est la forme $\\sqrt{u}$ avec $u = \\frac{x+1}{x-1}$.\n\n**Étape 1 : Calcul de $u'$ (dérivée du quotient).**\n$u' = \\frac{1(x-1) - (x+1)(1)}{(x-1)^2} = \\frac{-2}{(x-1)^2}$.\n\n**Étape 2 : Application de la formule $\\frac{u'}{2\\sqrt{u}}$.**\n$f'(x) = \\frac{-\\frac{2}{(x-1)^2}}{2\\sqrt{\\frac{x+1}{x-1}}}$.\n\n**Simplification :**\n$f'(x) = -\\frac{2}{2(x-1)^2} \\times \\frac{1}{\\sqrt{\\frac{x+1}{x-1}}} = -\\frac{1}{(x-1)^2 \\sqrt{\\frac{x+1}{x-1}}}$.\n\n**Résultat final :**\n$f'(x) = -\\frac{1}{(x-1)^2} \\sqrt{\\frac{x-1}{x+1}}$.",
                    "extras": [
                        "Exemple complet : Soit $f(x) = \\frac{\\sqrt{x^2+1}}{x}$. \nForme $u/v$ avec $u=\\sqrt{x^2+1}$ et $v=x$.\n$u' = \\frac{x}{\\sqrt{x^2+1}}$ et $v'=1$.\n$f'(x) = \\frac{\\frac{x}{\\sqrt{x^2+1}} \\cdot x - \\sqrt{x^2+1} \\cdot 1}{x^2} = \\frac{\\frac{x^2 - (x^2+1)}{\\sqrt{x^2+1}}}{x^2} = -\\frac{1}{x^2\\sqrt{x^2+1}}$.",
                        "Exemple complet : Soit $f(x) = \\frac{x\\sqrt{x}}{x+1}$. \nNumérateur $u=x\\sqrt{x}, u'=\\frac{3}{2}\\sqrt{x}$. Dénominateur $v=x+1, v'=1$.\n$f'(x) = \\frac{\\frac{3}{2}\\sqrt{x}(x+1) - x\\sqrt{x}(1)}{(x+1)^2} = \\frac{\\frac{3x\\sqrt{x} + 3\\sqrt{x} - 2x\\sqrt{x}}{2}}{(x+1)^2} = \\frac{x\\sqrt{x} + 3\\sqrt{x}}{2(x+1)^2}$.",
                        "Exemple complet : Soit $f(x) = \\sqrt{x^2+x}$. \n$u = x^2+x, u'=2x+1$.\n$f'(x) = \\frac{2x+1}{2\\sqrt{x^2+x}}$.",
                        "Exemple complet : Soit $f(x) = \\frac{\\sqrt{x}}{x^2}$. \n$f(x) = x^{0,5} / x^2 = x^{-1,5}$.\n$f'(x) = -1,5 x^{-2,5} = -\\frac{1,5}{x^2\\sqrt{x}}$.",
                        "Exemple complet : Soit $f(x) = \\sqrt{1 + \\sqrt{x}}$. \n$u = 1+\\sqrt{x}, u' = \\frac{1}{2\\sqrt{x}}$.\n$f'(x) = \\frac{\\frac{1}{2\\sqrt{x}}}{2\\sqrt{1+\\sqrt{x}}} = \\frac{1}{4\\sqrt{x}\\sqrt{1+\\sqrt{x}}}$."
                    ]
                }
            ]


            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
