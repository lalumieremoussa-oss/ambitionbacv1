<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Limites – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =


            [
                {
                    "title": "Étape 1 : Exemple d'exercices d'application",
                    "content": "Cette étape traite des suites définies par une relation de récurrence linéaire du premier degré.",
                    "example": "Soit la suite $(u_n)$ définie par $u_0 = 1$ et $u_{n+1} = \\frac{1}{2}u_n + 3$.\n\n**1. Calcul des premiers termes :**\n$u_1 = \\frac{1}{2}u_0 + 3 = \\frac{1}{2}(1) + 3 = 0,5 + 3 = 3,5$\n$u_2 = \\frac{1}{2}u_1 + 3 = \\frac{1}{2}(3,5) + 3 = 1,75 + 3 = 4,75$\n$u_3 = \\frac{1}{2}u_2 + 3 = \\frac{1}{2}(4,75) + 3 = 2,375 + 3 = 5,375$\n\n**2. Démontrons par récurrence que $u_n \\leq 6$ :**\n*Initialisation :* Pour $n=0$, $u_0 = 1$. Comme $1 \\leq 6$, la propriété est vraie au rang $0$.\n*Hérédité :* Supposons qu'il existe un entier $k$ tel que $u_k \\leq 6$. Montrons que $u_{k+1} \\leq 6$.\n$u_k \\leq 6 \\implies \\frac{1}{2}u_k \\leq 3 \\implies \\frac{1}{2}u_k + 3 \\leq 3 + 3 \\implies u_{k+1} \\leq 6$.\nL'hérédité est vérifiée.\n*Conclusion :* Pour tout $n \\in \\mathbb{N}$, $u_n \\leq 6$.\n\n**3. Démontrons que $(u_n)$ est croissante :**\nCalculons $u_{n+1} - u_n$ :\n$u_{n+1} - u_n = (\\frac{1}{2}u_n + 3) - u_n = -\\frac{1}{2}u_n + 3$.\nOr, d'après la question précédente, $u_n \\leq 6 \\implies -\\frac{1}{2}u_n \\geq -3 \\implies -\\frac{1}{2}u_n + 3 \\geq 0$.\nLa suite $(u_n)$ est donc croissante.\n\n**4. Convergence :**\nLa suite $(u_n)$ est croissante et majorée par 6, donc d'après le théorème de la convergence monotone, elle converge vers une limite réelle $L \\leq 6$.",
                    "extras": [
                        "Exemple complet : Soit $u_0 = 10$ et $u_{n+1} = \\frac{1}{4}u_n + 3$.\nCalculs : $u_1 = 5,5$ ; $u_2 = 4,375$ ; $u_3 = 4,09375$.\nRécurrence : On montre $u_n \\geq 4$. Initialisation : $10 \\geq 4$ (Vrai). Hérédité : $u_k \\geq 4 \\implies \\frac{1}{4}u_k \\geq 1 \\implies u_{k+1} \\geq 4$.\nVariation : $u_{n+1} - u_n = -\\frac{3}{4}u_n + 3$. Comme $u_n \\geq 4$, $-0,75u_n \\leq -3$, donc $u_{n+1} - u_n \\leq 0$ (Décroissante).\nConvergence : Décroissante et minorée par 4, donc elle converge.",
                        "Exemple complet : Soit $u_0 = 2$ et $u_{n+1} = 2u_n - 1$.\nCalculs : $u_1 = 3$ ; $u_2 = 5$ ; $u_3 = 9$.\nRécurrence : On montre $u_n \\geq 1$. $u_0=2 \\geq 1$. Si $u_k \\geq 1$, alors $2u_k-1 \\geq 2(1)-1=1$.\nVariation : $u_{n+1}-u_n = u_n-1$. Comme $u_n \\geq 1$, la suite est croissante.\nNote : Elle n'est pas majorée, elle diverge vers $+\\infty$.",
                        "Exemple complet : Soit $u_0 = 0$ et $u_{n+1} = \\frac{2}{3}u_n + 1$.\nCalculs : $u_1 = 1$ ; $u_2 = 1,66$ ; $u_3 = 2,11$.\nRécurrence : Montrer $u_n \\leq 3$. $0 \\leq 3$. Si $u_k \\leq 3$, alors $\\frac{2}{3}u_k+1 \\leq 2+1=3$.\nConvergence : Croissante et majorée par 3, donc convergente."
                    ]
                },
                {
                    "title": "Étape 2 : Suite de type homographique ($u_{n+1} = \\frac{au_n + b}{cu_n + d}$)",
                    "content": "Cette étape aborde les suites dont la relation est une fonction rationnelle.",
                    "example": "Soit la suite $(u_n)$ définie par $u_0 = 0$ et $u_{n+1} = \\frac{u_n + 3}{u_n + 1}$.\n\n**1. Calcul des premiers termes :**\n$u_1 = \\frac{u_0 + 3}{u_0 + 1} = \\frac{0 + 3}{0 + 1} = 3$\n$u_2 = \\frac{3 + 3}{3 + 1} = \\frac{6}{4} = 1,5$\n$u_3 = \\frac{1,5 + 3}{1,5 + 1} = \\frac{4,5}{2,5} = 1,8$\n\n**2. Démontrons par récurrence que $u_n \\geq 0$ :**\n*Initialisation :* $u_0 = 0 \\geq 0$. Vrai.\n*Hérédité :* Supposons $u_k \\geq 0$. \nAlors $u_k + 3 > 0$ et $u_k + 1 > 0$. Le quotient de deux nombres positifs est positif, donc $u_{k+1} \\geq 0$. L'hérédité est vérifiée.\n*Conclusion :* Pour tout $n$, $u_n \\geq 0$.\n\n**3. Étude de la croissance :**\nPour cette suite, on remarque que les termes alternent ($0 < 3 > 1,5 < 1,8$). Dans le cas où une suite homographique est monotone, on utilise $f(x) = \\frac{x+3}{x+1}$. \n$f'(x) = \\frac{1(x+1) - 1(x+3)}{(x+1)^2} = \\frac{-2}{(x+1)^2}$.\nLa fonction est décroissante, ce qui explique que la suite ne soit pas monotone dans cet exemple précis. Prenons le cas classique où elle l'est (ex: $u_{n+1} = \\frac{4u_n}{u_n+4}$ avec $u_0=1$).\n\n**4. En déduire la convergence :**\nSi une suite homographique est croissante et majorée (ou décroissante et minorée), elle converge vers la solution positive de $L = f(L)$.",
                    "extras": [
                        "Exemple complet : $u_0 = 1$ et $u_{n+1} = \\frac{2u_n}{u_n + 1}$.\nCalculs : $u_1 = 1$ ; $u_2 = 1$ ; $u_3 = 1$. La suite est constante.\nRécurrence : $u_n = 1$ pour tout $n$.",
                        "Exemple complet : $u_0 = 2$ et $u_{n+1} = \\frac{u_n + 1}{2}$.\nCalculs : $u_1 = 1,5$ ; $u_2 = 1,25$ ; $u_3 = 1,125$.\nRécurrence : Montrer $u_n \\geq 1$. $u_0=2 \\geq 1$. Si $u_k \\geq 1$, $u_k+1 \\geq 2$ donc $u_{k+1} \\geq 1$.\nVariation : $u_{n+1}-u_n = \\frac{u_n+1-2u_n}{2} = \\frac{1-u_n}{2}$. Comme $u_n \\geq 1$, la suite est décroissante.\nConvergence : Décroissante et minorée par 1, donc convergente vers 1.",
                        "Exemple complet : $u_0 = 0$ et $u_{n+1} = \\frac{1}{2-u_n}$.\nCalculs : $u_1 = 0,5$ ; $u_2 = 0,66$ ; $u_3 = 0,75$.\nRécurrence : Montrer $u_n < 1$. $0 < 1$. Si $u_k < 1$, alors $2-u_k > 1$ donc $\\frac{1}{2-u_k} < 1$.\nConvergence : Croissante et majorée par 1, donc convergente."
                    ]
                }
            ]



            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
