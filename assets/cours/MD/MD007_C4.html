<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Limites – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =


            [
                {
                    "title": "Étape 1 : Démonstration qu'une suite est arithmétique",
                    "content": "Pour démontrer qu'une suite $(V_n)$ est arithmétique, on doit prouver que la différence entre deux termes consécutifs est constante. \nOn calcule la différence $V_{n+1} - V_n$ et on doit obtenir un nombre réel $r$ indépendant de $n$. Ce nombre $r$ est appelé la raison de la suite.\nDans de nombreux problèmes, on utilise une suite auxiliaire $(V_n)$ liée à une suite $(U_n)$ plus complexe pour simplifier l'étude du comportement de cette dernière.",
                    "example": "Soit la suite $(U_n)$ définie par $U_0 = 1$ et $U_{n+1} = \\frac{U_n}{1 + 2U_n}$.\nOn pose la suite $(V_n)$ définie pour tout $n$ par $V_n = \\frac{1}{U_n}$.\nDémontrons que $(V_n)$ est une suite arithmétique :\n\nCalcul de $V_{n+1}$ :\n$V_{n+1} = \\frac{1}{U_{n+1}} = \\frac{1}{\\frac{U_n}{1 + 2U_n}} = \\frac{1 + 2U_n}{U_n}$\n$V_{n+1} = \\frac{1}{U_n} + \\frac{2U_n}{U_n} = V_n + 2$.\n\nCalcul de la différence :\n$V_{n+1} - V_n = (V_n + 2) - V_n = 2$.\n\nConclusion :\nLa suite $(V_n)$ est une suite arithmétique de raison $r = 2$.\nLe premier terme est $V_0 = \\frac{1}{U_0} = \\frac{1}{1} = 1$.",
                    "extras": [
                        "Exemple complet : Soit $U_{n+1} = U_n + 5$ avec $U_0 = 2$. \nCalcul de la différence : $U_{n+1} - U_n = 5$. \nLa suite est arithmétique de raison $r = 5$ et $U_0 = 2$.",
                        "Exemple complet : Soit $V_n = 3n - 7$. \n$V_{n+1} - V_n = [3(n+1) - 7] - (3n - 7) = 3n + 3 - 7 - 3n + 7 = 3$. \nLa suite est arithmétique de raison $r = 3$ et $V_0 = -7$.",
                        "Exemple complet : On pose $V_n = \\ln(U_n)$ avec $U_{n+1} = e^4 \\times U_n$. \n$V_{n+1} - V_n = \\ln(U_{n+1}) - \\ln(U_n) = \\ln(\\frac{U_{n+1}}{U_n}) = \\ln(e^4) = 4$. \nLa suite est arithmétique de raison $r = 4$."
                    ]
                },
                {
                    "title": "Étape 2 : Formule explicite (Exprimer en fonction de $n$)",
                    "content": "Lorsqu'une suite $(V_n)$ est arithmétique de raison $r$ et de premier terme $V_0$, on peut exprimer n'importe quel terme directement en fonction de son indice $n$.\nLa formule générale est : $V_n = V_0 + n \\times r$.\nSi la suite commence à un rang $p$ quelconque, la formule devient : $V_n = V_p + (n - p) \\times r$.\nCette forme explicite est essentielle pour calculer des termes de rang élevé sans avoir à calculer tous les termes intermédiaires.",
                    "example": "Reprenons la suite $(V_n)$ de l'étape 1 où $V_0 = 1$ et $r = 2$.\n\nExpression de $V_n$ en fonction de $n$ :\n$V_n = V_0 + n \\times r$\n$V_n = 1 + n \\times 2$\n$V_n = 2n + 1$.\n\nDéduction de $U_n$ en fonction de $n$ :\nOn sait que $V_n = \\frac{1}{U_n}$, donc $U_n = \\frac{1}{V_n}$.\nEn remplaçant $V_n$ par son expression trouvée :\n$U_n = \\frac{1}{2n + 1}$.\n\nCalcul du 10ème terme ($U_{10}$) :\n$U_{10} = \\frac{1}{2(10) + 1} = \\frac{1}{21}$.",
                    "extras": [
                        "Exemple complet : Une suite arithmétique de raison $r = -3$ et $V_0 = 10$. \nL'expression explicite est $V_n = 10 + n(-3) = 10 - 3n$. \nPour $n=100$, $V_{100} = 10 - 300 = -290$.",
                        "Exemple complet : Soit une suite où $V_5 = 20$ et $r = 4$. \n$V_n = V_5 + (n - 5) \\times 4 = 20 + 4n - 20 = 4n$. \nLe terme général est $V_n = 4n$.",
                        "Exemple complet : Soit $V_n = 15 - 2n$. \nC'est une suite arithmétique de premier terme $V_0 = 15$ et de raison $r = -2$."
                    ]
                },
                {
                    "title": "Étape 3 : Somme des $n$ premiers termes d'une suite arithmétique",
                    "content": "La somme $S$ de termes consécutifs d'une suite arithmétique est donnée par la formule :\n$S = (\\text{Nombre de termes}) \\times \\frac{\\text{Premier terme} + \\text{Dernier terme}}{2}$.\nSi la somme va de $V_0$ à $V_n$, le nombre de termes est $(n + 1)$.\n$S = (n + 1) \\times \\frac{V_0 + V_n}{2}$.\nCette formule permet de calculer rapidement des cumuls, comme des épargnes totales ou des distances parcourues.",
                    "example": "Calculons la somme $S = V_0 + V_1 + ... + V_{50}$ pour la suite $V_n = 2n + 1$ définie précédemment.\n\n1. Nombre de termes :\nDe $0$ à $50$, il y a $50 - 0 + 1 = 51$ termes.\n\n2. Identification des termes extrêmes :\n$V_0 = 1$\n$V_{50} = 2(50) + 1 = 101$.\n\n3. Calcul de la somme :\n$S = 51 \\times \\frac{1 + 101}{2}$\n$S = 51 \\times \\frac{102}{2}$\n$S = 51 \\times 51 = 2601$.",
                    "extras": [
                        "Exemple complet : Calculer la somme des 100 premiers entiers naturels non nuls ($1 + 2 + ... + 100$). \nNombre de termes = 100. \n$S = 100 \\times \\frac{1 + 100}{2} = 50 \\times 101 = 5050$.",
                        "Exemple complet : Somme de $V_n = 5n - 2$ de $n=1$ à $n=10$. \nNombre de termes = $10 - 1 + 1 = 10$. \n$V_1 = 3$ et $V_{10} = 48$. \n$S = 10 \\times \\frac{3 + 48}{2} = 5 \\times 51 = 255$.",
                        "Exemple complet : Un forage coûte 1000 CFA pour le 1er mètre, puis 500 CFA de plus par mètre supplémentaire. Pour 10 mètres : \n$V_0 = 1000$, $V_9 = 1000 + 9(500) = 5500$. \nCoût total = $10 \\times \\frac{1000 + 5500}{2} = 5 \\times 6500 = 32500$ CFA."
                    ]
                }
            ]



            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
