<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Limites – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =


            [
                {
                    "title": "Étape unique : Étude complète d'une suite arithmético-géométrique",
                    "content": "**I. Résumé des formules des suites géométriques**\nUne suite $(V_n)$ est géométrique de raison $q$ et de premier terme $V_0$ si $V_{n+1} = q \times V_n$.\n- Terme général : $V_n = V_0 \times q^n$\n- Somme des termes : $S_n = V_0 + V_1 + ... + V_n = V_0 \times \\frac{1 - q^{n+1}}{1 - q}$ (pour $q \\neq 1$)\n- Limite : Si $|q| < 1$, alors $\\lim_{n \\to +\\infty} V_n = 0$.\n\n**II. Exercice d'application complet**\nOn considère la suite $(U_n)$ définie par $U_0 = 1$ et $U_{n+1} = \\frac{1}{2}U_n + 3$.",
                    "example": "**Correction détaillée de l'exercice :**\n\n**1. Calcul des premiers termes :**\n$U_1 = \\frac{1}{2}(1) + 3 = 0,5 + 3 = 3,5$\n$U_2 = \\frac{1}{2}(3,5) + 3 = 1,75 + 3 = 4,75$\n$U_3 = \\frac{1}{2}(4,75) + 3 = 2,375 + 3 = 5,375$\n\n**2. Démontrons par récurrence que $U_n \\leq 6$ :**\n- Initialisation : $U_0 = 1$. Or $1 \\leq 6$, donc vrai au rang $0$.\n- Hérédité : Supposons $U_n \\leq 6$. Montrons que $U_{n+1} \\leq 6$.\n$U_n \\leq 6 \\implies \\frac{1}{2}U_n \\leq 3 \\implies \\frac{1}{2}U_n + 3 \\leq 3 + 3 \\implies U_{n+1} \\leq 6$. Hérédité vérifiée.\n- Conclusion : $\\forall n \\in \\mathbb{N}, U_n \\leq 6$.\n\n**3. Démontrons que $U_n$ est croissante :**\n$U_{n+1} - U_n = \\frac{1}{2}U_n + 3 - U_n = -\\frac{1}{2}U_n + 3$.\nOr $U_n \\leq 6 \\implies -\\frac{1}{2}U_n \\geq -3 \\implies -\\frac{1}{2}U_n + 3 \\geq 0$.\nLa suite est donc croissante.\n\n**4. Convergence :**\nLa suite est croissante et majorée par 6, elle est donc convergente.\n\n**5-a. Suite géométrique :**\n$V_n = U_n - 6$. $V_{n+1} = U_{n+1} - 6 = (\\frac{1}{2}U_n + 3) - 6 = \\frac{1}{2}U_n - 3 = \\frac{1}{2}(U_n - 6) = \\frac{1}{2}V_n$.\n$(V_n)$ est géométrique de raison $q = \\frac{1}{2}$ et de premier terme $V_0 = 1 - 6 = -5$.\n\n**5-b. Expressions de $V_n$ et $U_n$ :**\n$V_n = -5 \\times (\\frac{1}{2})^n$\n$U_n = V_n + 6 = -5 \\times (\\frac{1}{2})^n + 6$\n\n**5-e. Calcul de $U_{10}$ :**\n$U_{10} = -5 \\times (\\frac{1}{2})^{10} + 6 = -5 \\times \\frac{1}{1024} + 6 = -\\frac{5}{1024} + 6 = \\frac{6139}{1024} \\approx 5,995$.\n\n**5-f. Limite de $U_n$ :**\n$|1/2| < 1$ donc $\\lim_{n \\to +\\infty} (1/2)^n = 0$. Ainsi, $\\lim_{n \\to +\\infty} U_n = 6$.\n\n**6-a. Expression de $S_n$ :**\n$S_n = -5 \\times \\frac{1 - (1/2)^{n+1}}{1 - 1/2} = -5 \\times \\frac{1 - (1/2)^{n+1}}{1/2} = -10(1 - (\\frac{1}{2})^{n+1})$.\n\n**6-b. Expression de $T_n$ :**\n$T_n = \\sum (V_k + 6) = S_n + 6(n+1) = -10(1 - (\\frac{1}{2})^{n+1}) + 6n + 6$.\n\n**6-c. Limite de $T_n$ :**\n$\\lim_{n \\to +\\infty} T_n = +\\infty$ à cause du terme $6n$.",
                    "extras": [
                        "Exemple complet 2 : $U_0 = 10, U_{n+1} = 0,8U_n + 2, V_n = U_n - 10$.\n1. $U_1=10, U_2=10, U_3=10$. \n2. Récurrence : $U_n \\leq 10$ (ici elle est constante).\n3. $U_{n+1}-U_n = -0,2U_n + 2 = 0$ (car $U_n=10$).\n4. Converge vers 10.\n5-a. $V_{n+1} = 0,8U_n+2-10 = 0,8(U_n-10) = 0,8V_n$. Raison $0,8, V_0=0$.\n5-b. $V_n = 0 \\times 0,8^n = 0$. $U_n = 10$.\n6-a. $S_n = 0$. $T_n = 10(n+1)$. Limite $T_n = +\\infty$.",
                        "Exemple complet 3 : $U_0 = 2, U_{n+1} = 2U_n - 3, V_n = U_n - 3$.\n1. $U_1=1, U_2=-1, U_3=-5$.\n2. Récurrence : $U_n \\leq 3$. $U_0=2 \\leq 3$ (V). Si $U_n \\leq 3$, $2U_n \\leq 6 \\implies 2U_n-3 \\leq 3$. (V).\n3. $U_{n+1}-U_n = U_n-3$. Comme $U_n \\leq 3$, diff $\\leq 0$. Suite décroissante.\n4. Décroissante et minorée ? Non, elle diverge vers $-\\infty$.\n5-a. $V_{n+1} = 2U_n-3-3 = 2(U_n-3) = 2V_n$. Raison $q=2, V_0=2-3=-1$.\n5-b. $V_n = -1 \\times 2^n. U_n = -2^n + 3$.\n5-f. Limite $U_n = -\\infty$ (car $2>1$).\n6-a. $S_n = -1 \\times \\frac{1-2^{n+1}}{1-2} = 1-2^{n+1}$.\n6-b. $T_n = S_n + 3(n+1) = 1-2^{n+1} + 3n + 3 = 3n + 4 - 2^{n+1}$.\n6-c. Limite de $T_n = -\\infty$ (l'exponentielle l'emporte sur $3n$)."
                    ]
                }
            ]



            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
