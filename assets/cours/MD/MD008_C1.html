<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA Maths CI</title>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="tex-chtml.js"></script>

    <style>
        :root {
            --orange: #FF8C00;
            --vert: #009e49;
            --fond: #f4f6f8;
            --bleu: #1a237e;
        }

        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--fond);
            margin: 0;
        }

        /* PLEIN ÉCRAN */
        .main {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARTE LARGE */
        .card {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid var(--vert);
        }

        /* TITRE */
        h2 {
            text-align: center;
            color: var(--bleu);
            margin-bottom: 25px;
        }

        /* TEXTE (ANTI-DEBORDEMENT) */
        #content {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* MATH (SCROLL SI TROP LONG) */
        mjx-container {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        /* CONTENU */
        .step-title {
            color: var(--orange);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .example {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .extra {
            background: #fff3e0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* BOUTONS */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-extra {
            background: var(--orange);
            color: white;
        }

        .btn-next {
            background: var(--vert);
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="card">
            <h2>Limites – par Formateur Coulibaly 🇨🇮</h2>

            <div id="content"></div>

            <div class="buttons">
                <button class="btn-extra" onclick="showExample()">Autre exemple</button>
                <button class="btn-next" onclick="nextStep()">Ça va, on avance</button>
            </div>
        </div>

    </div>

    <script>

        let step = 0;
        let exampleIndex = 0;

        const steps =



            [
                {
                    "title": "Étape 1 : Le Point Moyen $G$ et les Moyennes Marginales",
                    "content": "Dans une série statistique double portant sur deux caractères $X$ et $Y$, le point moyen $G$ est le point dont les coordonnées sont les moyennes respectives des séries $x_i$ et $y_i$.\nCes moyennes, notées $\\bar{X}$ et $\\bar{Y}$, représentent le centre de gravité du nuage de points.\nLes formules sont les suivantes :\n- Abscisse moyenne : $\\bar{X} = \\frac{1}{n} \\sum_{i=1}^{n} x_i$\n- Ordonnée moyenne : $\\bar{Y} = \\frac{1}{n} \\sum_{i=1}^{n} y_i$\nOù $n$ désigne l'effectif total (le nombre de points du nuage).",
                    "example": "Soit la série statistique suivante représentant les notes de 8 élèves en Mathématiques ($X$) et en Physique ($Y$) :\n$X : \\{2 ; 4 ; 4 ; 5 ; 7 ; 7 ; 8 ; 8\\}$\n$Y : \\{3 ; 5 ; 6 ; 7 ; 10 ; 11 ; 8 ; 12\\}$\n\nCalculons les coordonnées du point moyen $G$ :\n\nNombre de points $n = 8$.\nCalcul de $\\bar{X}$ :\n$\\bar{X} = \\frac{2+4+4+5+7+7+8+8}{8} = \\frac{45}{8} = 5,625$\n\nCalcul de $\\bar{Y}$ :\n$\\bar{Y} = \\frac{3+5+6+7+10+11+8+12}{8} = \\frac{62}{8} = 7,75$\n\nConclusion :\nLe point moyen est $G(5,63 ; 7,75)$.",
                    "extras": [
                        "Exemple complet : Soit une série de 5 points $X=\\{10; 12; 15; 18; 20\\}$ et $Y=\\{5; 8; 10; 12; 15\\}$.\n$\\bar{X} = (10+12+15+18+20)/5 = 75/5 = 15$.\n$\\bar{Y} = (5+8+10+12+15)/5 = 50/5 = 10$.\nLe point moyen est $G(15 ; 10)$.",
                        "Exemple complet : Étude de la taille ($X$) en cm et du poids ($Y$) en kg de 4 individus : $(160; 60), (170; 70), (180; 80), (190; 90)$.\n$\\bar{X} = (160+170+180+190)/4 = 700/4 = 175$.\n$\\bar{Y} = (60+70+80+90)/4 = 300/4 = 75$.\n$G(175 ; 75)$.",
                        "Remarque : Le point moyen permet de vérifier graphiquement la cohérence de l'ajustement car la droite de régression doit impérativement passer par ce point $G$."
                    ]
                },
                {
                    "title": "Étape 2 : Variance, Covariance et Coefficient de Corrélation",
                    "content": "Pour analyser la liaison entre deux caractères, on utilise trois indicateurs clés :\n1. **La Variance $V(X)$** : Elle mesure la dispersion. On utilise souvent la formule de Koenig :\n$V(X) = \\left( \\frac{1}{n} \\sum x_i^2 \\right) - (\\bar{X})^2$.\nL'écart-type est $\\sigma(X) = \\sqrt{V(X)}$.\n\n2. **La Covariance $Cov(X,Y)$** : Elle indique le sens de variation commune :\n$Cov(X,Y) = \\left( \\frac{1}{n} \\sum x_i y_i \\right) - (\\bar{X} \\times \\bar{Y})$.\n\n3. **Le Coefficient de corrélation linéaire $r$** :\n$r = \\frac{Cov(X,Y)}{\\sigma(X) \\times \\sigma(Y)}$.\nIl est compris entre $-1$ et $1$. Si $|r| > 0,87$, l'ajustement linéaire est considéré comme excellent.",
                    "example": "Reprenons les données : $\\bar{X} = 5,625$ et $\\bar{Y} = 7,75$ avec $n=8$.\nCalculons $V(X)$ et $Cov(X,Y)$ :\n\nCalcul de $\\sum x_i^2$ :\n$2^2 + 4^2 + 4^2 + 5^2 + 7^2 + 7^2 + 8^2 + 8^2 = 4 + 16 + 16 + 25 + 49 + 49 + 64 + 64 = 287$.\n$V(X) = \\frac{287}{8} - (5,625)^2 = 35,875 - 31,64 = 4,235$.\n$\\sigma(X) = \\sqrt{4,235} \\approx 2,06$.\n\nCalcul de $\\sum x_i y_i$ :\n$(2\\times 3) + (4\\times 5) + (4\\times 6) + (5\\times 7) + (7\\times 10) + (7\\times 11) + (8\\times 8) + (8\\times 12) = 6 + 20 + 24 + 35 + 70 + 77 + 64 + 96 = 392$.\n$Cov(X,Y) = \\frac{392}{8} - (5,625 \\times 7,75) = 49 - 43,59 = 5,41$.",
                    "extras": [
                        "Interprétation de $r$ : Si $r = 0,95$, il existe une très forte corrélation positive entre les deux variables.",
                        "Exemple complet : Si $Cov(X,Y) = 12$, $\\sigma(X) = 4$ et $\\sigma(Y) = 3,5$.\n$r = 12 / (4 \\times 3,5) = 12 / 14 \\approx 0,86$. L'ajustement est satisfaisant.",
                        "Propriété : La covariance d'une variable avec elle-même est égale à sa variance : $Cov(X,X) = V(X)$."
                    ]
                },
                {
                    "title": "Étape 3 : Droite de Régression par la Méthode des Moindres Carrés",
                    "content": "L'ajustement linéaire consiste à trouver l'équation de la droite $(D)$ qui passe au plus près des points du nuage.\nCette droite, dite de régression de $Y$ en $X$, a pour équation réduite :\n$y = ax + b$\n\nLes coefficients $a$ et $b$ sont déterminés par les formules :\n- Le coefficient directeur : $a = \\frac{Cov(X,Y)}{V(X)}$\n- L'ordonnée à l'origine : $b = \\bar{Y} - a\\bar{X}$\n\nLa droite $(D)$ passe obligatoirement par le point moyen $G(\\bar{X} ; \\bar{Y})$.",
                    "example": "En utilisant les résultats précédents : $Cov(X,Y) = 5,41$, $V(X) = 4,235$, $\\bar{X} = 5,625$, $\\bar{Y} = 7,75$.\n\nCalcul du coefficient $a$ :\n$a = \\frac{5,41}{4,235} \\approx 1,28$.\n\nCalcul de l'ordonnée à l'origine $b$ :\n$b = 7,75 - (1,28 \\times 5,625)$\n$b = 7,75 - 7,2 = 0,55$.\n\nL'équation de la droite de régression est donc :\n$(D) : y = 1,28x + 0,55$.",
                    "extras": [
                        "Estimation : Pour une valeur de $x = 10$, on peut estimer $y$ en calculant $y = 1,28(10) + 0,55 = 13,35$.",
                        "Exemple complet : Avec $a=0,5$, $\\bar{X}=10$ et $\\bar{Y}=12$.\n$b = 12 - (0,5 \\times 10) = 12 - 5 = 7$.\nL'équation est $y = 0,5x + 7$.",
                        "Vérification : Pour s'assurer du résultat, on vérifie que $a \\times \\bar{X} + b$ redonne bien $\\bar{Y}$."
                    ]
                }
            ]


            ;

        function formatText(text) {
            if (!text) return "";

            return text
                // **gras**
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

                // double saut de ligne
                .replace(/\n\n/g, "<br><br>")

                // saut simple
                .replace(/\n/g, "<br>");
        }

        function renderStep() {
            exampleIndex = 0;

            let html = `
        <div class="step-title">${formatText(steps[step].title)}</div>

        <div>${formatText(steps[step].content)}</div>

        <div class="example">
            ${formatText(steps[step].example)}
        </div>

        <div id="extras"></div>
    `;

            document.getElementById("content").innerHTML = html;

            renderMath();
        }

        function showExample() {
            let extrasDiv = document.getElementById("extras");

            if (exampleIndex < steps[step].extras.length) {

                let div = document.createElement("div");
                div.className = "extra";

                div.innerHTML = formatText(
                    steps[step].extras[exampleIndex]
                );

                extrasDiv.appendChild(div);

                exampleIndex++;

                renderMath();
            }

            if (exampleIndex >= steps[step].extras.length) {
                document.querySelector(".btn-extra").style.display = "none";
            }
        }

        function nextStep() {
            step++;

            document.querySelector(".btn-extra").style.display = "block";

            if (step < steps.length) {
                renderStep();
            } else {
                document.getElementById("content").innerHTML = `
            <h3 style="color:green;text-align:center;">
                🎉 Leçon terminée !
            </h3>
        `;
                document.querySelector(".buttons").style.display = "none";
            }
        }

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        renderStep();

    </script>

</body>

</html>
