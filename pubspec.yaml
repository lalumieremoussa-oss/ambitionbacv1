name: ambitionbac
description: Application mobile éducative ivoirienne Ambition+ Bac.
publish_to: 'none'
version: 1.0.0+1


environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.3
  shared_preferences: ^2.3.3
  hive_flutter: ^1.1.0

  syncfusion_flutter_pdfviewer: ^33.1.47
  syncfusion_pdfviewer_platform_interface: ^33.1.47
  syncfusion_flutter_pdf: ^33.1.47 

  audioplayers: ^6.1.0
  fl_chart: ^1.1.1
  vector_math: ^2.3.0

  flutter_markdown: ^0.7.4+1
  flutter_markdown_latex: ^0.3.4
  flutter_math_fork: ^0.7.0

  connectivity_plus: ^6.1.0
  flutter_html: ^3.0.0-beta.2
  flutter_widget_from_html_core: ^0.17.2
  flutter_widget_from_html: ^0.17.2

  webview_flutter: ^4.13.0
  no_screenshot: ^1.0.1 
  share_plus: ^12.0.2
  url_launcher: ^6.3.1
  flutter_dotenv: ^6.0.0
  record: ^6.1.1
  flutter_tts: ^3.8.3
  speech_to_text: ^7.3.0
  cached_network_image: ^3.3.1

  http: ^1.2.0

  app_links: ^6.0.0
  video_player: ^2.8.1
  video_thumbnail: ^0.5.3
  image_picker: ^1.0.5
  file_picker: ^8.1.0

  google_mlkit_text_recognition: ^0.13.0
  path_provider: ^2.1.1              
  device_info_plus: 12.1.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFF4F0"

dev_dependencies:
  flutter_test:
    sdk: flutter

  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  
  # 🔥 déplacé ici (correct)
  analyzer: '>=4.6.0 <7.0.0'

dependency_overrides:
  fl_chart: ^1.1.1
  vector_math: ^2.3.0
  intl: ^0.18.1

flutter:
  uses-material-design: true
  
  assets:
